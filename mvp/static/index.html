<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REL-UNITY — Operations</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="brand-logo" src="favicon.svg" alt="REL-UNITY logo">REL-UNITY <small>OPERATIONS</small></div>
  <nav><a href="index.html" class="on">Operations</a><a href="sales.html">Sales</a><a href="admin.html">Admin</a></nav>
  <div class="right"><span id="userbox" style="display:flex;align-items:center;gap:8px"></span><span class="envtag">LAN · MVP</span></div>
</header>

<main>
  <div class="page-head">
    <h1>Operations &amp; scheduling</h1>
    <p>Enter orders, watch them split into batches and slot into machine campaigns. Pre-treatment → RFD → dyeing, planned automatically.</p>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="section-tabs" id="secTabs">
    <button data-s="floor" class="on"><span class="material-symbols-rounded">grid_view</span>Shop floor</button>
    <button data-s="sched"><span class="material-symbols-rounded">calendar_view_week</span>Schedule</button>
    <button data-s="storage"><span class="material-symbols-rounded">shelves</span>Storage</button>
    <button data-s="massplan"><span class="material-symbols-rounded">table_view</span>Batch planner</button>
  </div>

  <!-- Shop floor -->
  <section class="view" id="v-floor">
    <div class="bar">
      <button class="btn ghost sm" onclick="setClock(0)">t</button>
      <button class="btn ghost sm" onclick="setClock(4)">t+4</button>
      <button class="btn ghost sm" onclick="setClock(8)">t+8</button>
      <button class="btn ghost sm" onclick="setClock(12)">t+12</button>
      <span class="small muted" id="clocklbl"></span>
    </div>
    <div class="floor" id="floor"></div>
  </section>

  <!-- Schedule -->
  <section class="view" id="v-sched" style="display:none">
    <div class="bar">
      <span class="small muted" id="schednote"></span>
      <button class="btn ghost sm" onclick="exportScheduleToExcel()"><span class="material-symbols-rounded">download</span>Export</button></div>
    <div class="gantt" id="gantt"></div>
    <div class="legend" id="legend"></div>
  </section>


  <!-- Storage -->
  <section class="view" id="v-storage" style="display:none">
    <div class="bar">
      <select id="stg_area"></select>
      <span class="small muted" id="stg_note"></span>
    </div>
    <div id="stg_grid"></div>
  </section>

  <!-- Mass planning -->
  <section class="view" id="v-massplan" style="display:none">
    <div class="bar">
      <span class="small muted" id="mp_note"></span>
      <span class="spacer"></span>
      <button class="btn mp-hold" id="mp_saveorder" style="display:none" onmousedown="mpHoldStart(event)" onmouseup="mpHoldCancel()" onmouseleave="mpHoldCancel()" ontouchstart="mpHoldStart(event)" ontouchend="mpHoldCancel()"><span class="hold-fill" id="mp_holdfill"></span><span class="hold-lbl"><span class="material-symbols-rounded">save</span>Hold 3s to save order</span></button>
    </div>
    <div id="mp_body"></div>
  </section>
</main>

<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script>
let S=null, CLOCK=0;

function renderKPIs(){
  const cursors=DB.machines.map(m=>S.tl[m.id].cursor);
  const spanH=(cursors.length?Math.max(...cursors):0)/60;
  const fin=Object.values(S.orderFinish);
  const avg=fin.length?(fin.reduce((a,b)=>a+b,0)/fin.length)/1440:0;
  const k=(ic,val,lbl,d)=>`<div class="kpi rise" style="animation-delay:${d}ms"><div class="ic-wrap"><span class="material-symbols-rounded">${ic}</span></div><b>${val}</b><small>${lbl}</small></div>`;
  document.getElementById("kpis").innerHTML=
     k('receipt_long',DB.orders.length,'Open orders',0)
    +k('layers',S.batchCount,'Batches',40)
    +k('wash',S.washCount,'Washes',80)
    +k('schedule',spanH.toFixed(1)+'h','Plan span',120)
    +k('event_available',avg.toFixed(1)+'d','Avg promise',160);
}
function draw(newKeys=[]){
  S=computeSchedule();
  renderKPIs();
  renderFloor(document.getElementById("floor"),S,CLOCK);
  renderGantt(document.getElementById("gantt"),S,newKeys);
  renderLegend(document.getElementById("legend"));
  document.getElementById("clocklbl").textContent=`Viewing at t+${CLOCK} h`;
  document.getElementById("schednote").textContent=`${S.batchCount} batches · ${S.washCount} washes · pre-treatment planned on drums/jiggers`;
}
function setClock(h){CLOCK=h;renderFloor(document.getElementById("floor"),S,CLOCK);document.getElementById("clocklbl").textContent=`Viewing at t+${CLOCK} h`;}
async function reload(){ await API.db(); draw(); }

/* section tabs */
document.getElementById("secTabs").addEventListener("click",e=>{
  const s=e.target.dataset.s; if(!s)return;
  // drop any stale Mass-planning pins from an abandoned "Add batch" flow; mpAddBatch re-sets them
  // right after it calls show("batch"), so a real manual add is unaffected.
  const _mc=document.getElementById("b_mc"); if(_mc){ delete _mc.dataset.mpMachine; delete _mc.dataset.mpDay; }
  document.querySelectorAll("#secTabs button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));
  document.querySelectorAll(".view").forEach(v=>v.style.display=(v.id==="v-"+s)?"":"none");
  if(s==="storage") renderStorageMap();
  if(s==="massplan") renderMassPlan();
});
function show(s){document.querySelector(`#secTabs button[data-s="${s}"]`).click();}

/* init */
/* ---------- batch maker ---------- */
function bLotCount(){ const c=document.getElementById("b_lotCount"),b=document.getElementById("b_lotBox"); if(c&&b) c.textContent=b.children.length+" / 8"; }
function bLotFilter(l){
  const q=document.getElementById("b_qual").value;
  const locked=document.getElementById("b_qual").disabled;
  const ordEl=document.getElementById("b_order");
  const ord=(DB.orders||[]).find(o=>o.id===(ordEl?ordEl.value:""));
  return (!q || sameFabric(l.quality,q) || !locked) && (!ord || l.customer===ord.cust);
}
function bLotRow(){
  return `<div class="lotqrow">
    ${lotPickerHTML("", "b-lot")}
    <input class="b-pcs" type="number" min="0" placeholder="pcs">
    <input class="b-mtr" type="number" min="0" placeholder="m">
    <input class="b-wt"  type="number" min="0" step="0.1" placeholder="kg">
    <button type="button" class="btn ghost sm b-takabtn" title="pick specific takas" onclick="openTakaPicker(this.closest('.lotqrow'))"><span class="material-symbols-rounded">tune</span>Takas</button>
    <button type="button" class="rm" title="remove" onclick="this.closest('.lotqrow').remove();bLotCount();bSyncTotals();bRefreshOrders();bLockQuality()">&times;</button>
    <div class="taka-pick"></div></div>`;
}
function bAddLot(){
  const box=document.getElementById("b_lotBox");
  if(!(DB.lots||[]).length){ toast("No lots yet — add them in Admin → Lot master"); return; }
  if(box.children.length>=8){ toast("A batch can hold at most 8 lots"); return; }
  box.insertAdjacentHTML("beforeend", bLotRow());
  const row=box.lastElementChild;
  wireLotPicker(row.querySelector(".b-lot"), { filterFn: bLotFilter,
    onSelect: ()=>{ bLockQuality(); bPrefillRow(row); bSyncTotals(); bRefreshOrders(); } });
  row.querySelectorAll(".b-pcs,.b-mtr,.b-wt").forEach(i=>i.oninput=bSyncTotals);
  row.querySelector(".b-mtr").addEventListener("input",()=>bSuggestWeight(row));
  row.querySelector(".b-mtr").addEventListener("change",()=>{ bSnapRow(row); bSyncTotals(); });
  bLockQuality(); bPrefillRow(row); bLotCount(); bSyncTotals(); bRefreshOrders();
}
function bPrefillRow(row){                       // start from what is still LEFT in the lot
  const id=lotPickVal(row.querySelector(".b-lot")), a=lotAllocation(id);
  row.querySelector(".b-mtr").value=a.remaining||"";
  row.querySelector(".b-mtr").max=a.remaining||undefined;
  row.querySelector(".b-pcs").max=a.remainingPcs||undefined;
  bSnapRow(row);
}

/* ---- a taka cannot be cut: round the ask up to whole takas ---- */
function bSnapRow(row){
  const id=lotPickVal(row.querySelector(".b-lot"));
  const out=row.querySelector(".taka-pick");
  const want=+row.querySelector(".b-mtr").value||0;
  if(!id || !want){ row.dataset.takas="[]"; if(out) out.innerHTML=""; return; }
  const pool=lotRemainingTakas(id);
  const pick=pickTakas(pool, want);
  row.dataset.takas=JSON.stringify(pick.takas);
  row.querySelector(".b-pcs").value=pick.pcs;
  row.querySelector(".b-mtr").value=pick.total;
  bSuggestWeight(row);
  if(!out) return;
  if(!pick.takas.length){ out.innerHTML='<span class="flag">nothing left in this lot</span>'; return; }
  const over=pick.total-want;
  out.innerHTML='<span class="material-symbols-rounded">straighten</span>'
    + '<b>'+pick.pcs+'</b> whole takas &middot; '+pick.takas.join(' + ')+' = <b class="tnum">'+pick.total+' m</b>'
    + (pick.short ? ' <span class="flag">only '+pick.total+' m left — short by '+(want-pick.total)+' m</span>'
      : over>0 ? ' <span class="muted">(asked '+want+' m; +'+over+' m — takas cannot be cut)</span>' : '');
}

/* ---- M/C No: dropdown of dye-capable machines for the selected quality ---- */
function bRefreshMachines(){
  const q=Q(document.getElementById("b_qual").value);
  const sel=document.getElementById("b_mc"); if(!sel) return;
  const cur=sel.value;
  const dyeType = q ? routeStep(q, dyeStepOf(q)).mc : "";
  const list = dyeType ? DB.machines.filter(m=>m.type===dyeType) : [];
  sel.innerHTML = '<option value="">— auto-assign —</option>'
    + list.map(m=>'<option value="'+esc(m.id)+'"'+(m.id===cur?" selected":"")+'>'+esc(m.id)+' ('+m.capMax+' kg)</option>').join("");
}

/* ---- one batch = one fabric: the first lot decides it — rebranded names (shared fabric
   group tag) are treated as the same fabric and can combine in one batch ---- */
function bLockQuality(){
  const ids=[...document.querySelectorAll('#b_lotBox .b-lot')].map(s2=>lotPickVal(s2)).filter(Boolean);
  const names=ids.map(id=>{const l=(DB.lots||[]).find(x=>x.id===id); return l&&l.quality;}).filter(Boolean);
  const qs=[...new Set(names)];
  const groupKey=n=>{ const q=Q(n); return (q&&q.fabricGroup)||n; };
  const groups=[...new Set(names.map(groupKey))];
  const sel=document.getElementById("b_qual"), hint=document.getElementById("b_qualHint");
  if(groups.length===1 && names.length && sel.value!==names[0]){ sel.value=names[0]; bRefreshShades(); bRefreshOrders(); bRefreshMachines(); }
  sel.disabled = qs.length>0;
  sel.classList.toggle("locked", qs.length>0);
  if(hint) hint.innerHTML = qs.length
    ? '<span class="material-symbols-rounded">lock</span>Locked by '+esc(ids[0])+(qs.length>1?' — combining rebranded names as one fabric':'')+' — a batch cannot mix different fabrics'
    : 'Pick a quality, or just add a lot and it will set itself';
}
function bSuggestWeight(row){                    // weight suggested from meters x gsm, still editable
  const q=Q(document.getElementById("b_qual").value);
  const m=+row.querySelector(".b-mtr").value||0;
  if(q && m) row.querySelector(".b-wt").value=Math.round(kgOf(m,q.gsm,q.width)*10)/10;
}
function openTakaPicker(row){
  const lotId=lotPickVal(row.querySelector(".b-lot"));
  if(!lotId){ toast("Pick a lot first"); return; }
  const lot=(DB.lots||[]).find(x=>x.id===lotId); if(!lot){ toast("Lot not found"); return; }
  let panel=row.querySelector(".takapick");
  if(panel){ panel.remove(); return; }               // toggle closed
  const picked=new Set((row.dataset.takaNos?JSON.parse(row.dataset.takaNos):[]).map(Number));
  const avail=lotTakaAvailability(lotId);
  panel=document.createElement("div"); panel.className="takapick";
  const draw=()=>{
    const chips=avail.map(t=>{
      const mine=picked.has(t.no);
      const used=t.used && t.byBatch!==null && !mine;   // used by another batch
      const cls="tp-chip"+(mine?" on":"")+(used?" used":"");
      return `<span class="${cls}" data-no="${t.no}" ${used?"":`onclick="tpToggle(this)"`}>T${t.no} · ${t.meters}m</span>`;
    }).join("");
    const tot=takaSelectionTotals(lot,[...picked]);
    panel.innerHTML=`<div class="small muted">Tick the takas for this batch — greyed = used by another batch.</div>
      <div class="tp-grid">${chips}</div>
      <div class="tp-sum">Selected: ${tot.pcs} pcs · ${tot.mtr} m</div>
      <div style="margin-top:6px"><button type="button" class="btn sm" onclick="tpApply(this)">Apply</button>
      <button type="button" class="btn ghost sm" onclick="this.closest('.takapick').remove()">Cancel</button></div>`;
  };
  panel.tpState={picked, lot, row, draw};
  row.appendChild(panel); draw();
}
function tpToggle(chip){
  const panel=chip.closest(".takapick"), no=+chip.dataset.no, st=panel.tpState;
  st.picked.has(no)?st.picked.delete(no):st.picked.add(no); st.draw();
}
function tpApply(btn){
  const panel=btn.closest(".takapick"), st=panel.tpState;
  const tot=takaSelectionTotals(st.lot,[...st.picked]);
  const row=st.row;
  row.dataset.takas=JSON.stringify(tot.takas);
  row.dataset.takaNos=JSON.stringify(tot.takaNos);
  row.querySelector(".b-pcs").value=tot.pcs;
  row.querySelector(".b-mtr").value=tot.mtr;
  const inMass=row.closest("#mp_lots");            // taka picker is shared by the batch maker and the mass-plan editor
  if(inMass) mpEditorSuggestWeight(row); else bSuggestWeight(row);   // weight must track the picked takas (spec §5.2)
  panel.remove();
  if(inMass) mpEditorSync(); else bSyncTotals();
}
function bRows(){
  return [...document.querySelectorAll('#b_lotBox .lotqrow')].map(r=>({
    lotId:lotPickVal(r.querySelector(".b-lot")),
    pcs:+r.querySelector(".b-pcs").value||0,
    mtr:+r.querySelector(".b-mtr").value||0,
    weight:+r.querySelector(".b-wt").value||0,
    takas:JSON.parse(r.dataset.takas||"[]"),
    takaNos: r.dataset.takaNos ? JSON.parse(r.dataset.takaNos) : [] })).filter(x=>x.lotId);
}
function bSyncTotals(){
  const rows=bRows(), el=document.getElementById("b_totals"); if(!el) return;
  const pcs=rows.reduce((a,r)=>a+r.pcs,0), mtr=rows.reduce((a,r)=>a+r.mtr,0),
        wt=Math.round(rows.reduce((a,r)=>a+r.weight,0)*10)/10;
  const q=Q(document.getElementById("b_qual").value), cap=q&&q.maxBatch;
  const willSplit = cap && wt>cap;
  el.innerHTML = rows.length
    ? `<span class="material-symbols-rounded">functions</span><b>Batch total</b>
       <span><b class="tnum">${pcs}</b> pcs</span><span><b class="tnum">${mtr}</b> m</span><span><b class="tnum">${wt}</b> kg</span>`
       + (willSplit ? ` <span class="flag">exceeds ${cap} kg max for ${esc(q.name)} — will save as ${Math.ceil(wt/cap)} separate batches</span>` : '')
    : '<span class="muted">add a lot to build the batch</span>';
}
function bLotCustomers(){
  const ids=[...document.querySelectorAll('#b_lotBox .b-lot')].map(s2=>lotPickVal(s2)).filter(Boolean);
  const names=ids.map(id=>{const l=(DB.lots||[]).find(x=>x.id===id); return l&&l.customer;}).filter(Boolean);
  return [...new Set(names)];
}
function bRefreshOrders(){
  const q=document.getElementById("b_qual").value, sel=document.getElementById("b_order"), cur=sel.value;
  const cs=bLotCustomers();
  let list=(DB.orders||[]).filter(o=>!q || o.qual===q);
  if(cs.length===1) list=list.filter(o=>o.cust===cs[0]);   // a customer's fabric fulfils that customer's order
  else if(cs.length>1) list=[];
  sel.innerHTML='<option value="">— none —</option>'
    + list.map(o=>`<option value="${esc(o.id)}"${o.id===cur?" selected":""}>${esc(orderLabel(o.id))}</option>`).join("");
  const hint=document.getElementById("b_orderHint");
  if(hint) hint.innerHTML = cs.length>1
      ? '<span class="flag">Lots belong to different customers — use one customer\'s fabric per batch</span>'
      : cs.length===1 ? ('Showing <b>'+esc(cs[0])+'</b> orders only — their fabric fulfils their order')
                      : 'Pick lots first — orders are filtered to that customer';
}
function bRefreshShades(){
  const q=document.getElementById("b_qual").value;
  const ordEl=document.getElementById("b_order");
  const ord=(DB.orders||[]).find(o=>o.id===(ordEl?ordEl.value:""));
  let list=shadesForQuality(q);
  if(ord){                                        // only the shades this order actually asked for
    const want=(ord.lines||[]).map(l=>l.shade);
    list=list.filter(s=>want.indexOf(s.shade)>=0);
  }
  const sh=document.getElementById("b_shade");
  sh.innerHTML = list.length
    ? list.map(s=>`<option>${esc(s.shade)}</option>`).join("")
    : `<option value="">— ${ord?"this order has no matching shade":"no shades for this quality"} —</option>`;
  const hint=document.getElementById("b_shadeHint");
  if(hint) hint.innerHTML = ord ? ('Limited to the shades on <b>'+esc(ord.id)+'</b>') : 'All shades for this quality';
}
async function submitBatch(){
  const q=document.getElementById("b_qual").value;
  if(!q){ toast("Pick a quality first"); return; }
  const g=id=>document.getElementById(id).value;
  const rows=bRows();
  for(const r of rows){ const a=lotAllocation(r.lotId);
    if(a.blocked){ toast(r.lotId+" is fully used by "+a.batches.join(", ")); return; } }
  if(!rows.length){ toast("Add at least one lot"); return; }
  for(const r of rows){ const a=lotAllocation(r.lotId);
    if(r.mtr > a.remaining){ toast(r.lotId+" has only "+a.remaining+" m left"); return; } }
  const quals=[...new Set(rows.map(r=>{const l=(DB.lots||[]).find(x=>x.id===r.lotId); return l&&l.quality;}).filter(Boolean))];
  const groupKey=n=>{ const qq=Q(n); return (qq&&qq.fabricGroup)||n; };
  if(new Set(quals.map(groupKey)).size>1){ toast("This batch mixes "+quals.join(" and ")+" — different fabrics, one fabric per batch"); return; }
  if(quals.length===1 && groupKey(quals[0])!==groupKey(q)){ toast("The lots are "+quals[0]+", a different fabric than "+q); return; }
  for(const r of rows){ if(!(r.takas||[]).length){ toast(r.lotId+": pick whole takas (enter the meters you need)"); return; } }
  const custs=bLotCustomers();
  if(custs.length>1){ toast("This batch mixes fabric from "+custs.join(" and ")+" — use one customer per batch"); return; }

  const qObj=Q(q), cap=qObj&&qObj.maxBatch;
  const mpMachine=document.getElementById("b_mc").dataset.mpMachine||g("b_mc");
  const mpDay=document.getElementById("b_mc").dataset.mpDay||new Date().toISOString().slice(0,10);
  const manualMode=!!document.getElementById("b_mc").dataset.mpMachine;   // came from Mass planning "Add batch"

  // Manual mode (Mass planning): one batch = one machine load. Block if the picked takas are
  // heavier than the assigned machine's cap — never auto-split. The legacy Batch-maker form keeps
  // the oversize whole-taka split (splitBatchRows) so a too-big order still becomes runnable loads.
  let groups;
  if(manualMode){
    const totalWt=Math.round(rows.reduce((a,r)=>a+(+r.weight||0),0)*10)/10;
    if(!mpCapacityOk(mpMachine, totalWt)){
      toast(mpMachine+" holds "+((DB.machines.find(x=>x.id===mpMachine)||{}).capMax)+" kg — this "+totalWt+" kg batch is too heavy. Remove takas or pick a bigger machine.");
      return;   // pins stay set so the operator can adjust takas and re-submit this same manual add
    }
    groups=[rows];
  } else {
    groups=splitBatchRows(rows, cap, cfg().minMeters||300);
  }

  const created=[];
  let mpSeq=nextSeq(mpMachine, mpDay);   // local counter: DB doesn't refresh mid-loop, so nextSeq() alone would repeat for multi-group splits
  for(const grp of groups){
    const tot={pcs:grp.reduce((a,r)=>a+r.pcs,0), mtr:grp.reduce((a,r)=>a+r.mtr,0),
               weight:Math.round(grp.reduce((a,r)=>a+r.weight,0)*10)/10};
    const row={ lots:grp, lotIds:grp.map(r=>r.lotId),
      orderId:g("b_order"), quality:q, shadeNo:g("b_shade"),
      mcPin:g("b_mc"), machine:mpMachine, planDay:mpDay, seq:mpSeq++,
      pcs:tot.pcs, mtr:tot.mtr, weight:tot.weight,
      status:"planned", notes:g("b_notes") };   // in/out time, pH, operator & shift are filled by the operator at the machine
    const res=await API.save("batches",row);
    if(res && res.error){ toast(res.error); return; }
    created.push({id:(res.row&&res.row.id)||"Batch", pcs:tot.pcs, mtr:tot.mtr, weight:tot.weight});
  }
  delete document.getElementById("b_mc").dataset.mpMachine;
  delete document.getElementById("b_mc").dataset.mpDay;
  // DB patched in place by each API.save above — no full reload needed
  const r=document.getElementById("batchResult"); r.classList.add("on");
  r.innerHTML = created.length>1
    ? `<h3>✓ Split into ${created.length} batches</h3>
       <div class="small muted">${esc(q)}'s max batch is ${cap} kg — this load was too heavy for one machine, so it was saved as ${created.length} separate batches.</div>
       <div style="margin:8px 0">${created.map(c=>`<span class="chip">${esc(c.id)} · ${c.pcs} pcs · ${c.mtr} m · ${c.weight} kg</span>`).join("")}</div>`
    : `<h3>✓ ${esc(created[0].id)} created</h3>
       <div class="small muted">${created[0].pcs} pcs · ${created[0].mtr} m · ${created[0].weight} kg · ${esc(q)}${g("b_shade")?" · "+esc(g("b_shade")):""}</div>`;
  document.getElementById("b_lotBox").innerHTML=""; bLotCount(); bSyncTotals();
  document.getElementById("b_notes").value="";
  document.getElementById("b_mc").value="";
  renderBatchList(); draw(created.map(c=>c.id));
  toast(created.length>1 ? "Split into "+created.length+" batches \u2014 added to the schedule" : "Batch created \u2014 added to the schedule");
}
const STATUS_ICON={planned:"schedule",running:"bolt",done:"check_circle"};
function batchStatusPill(b){
  const s=b.status||"planned";
  return `<span class="bstatus ${s}"><span class="material-symbols-rounded">${STATUS_ICON[s]}</span>${s}</span>`;
}
function batchLifeCell(b){
  const s=b.status||"planned";
  const auto=(cfg().completionMode==="auto");
  const autoNote=auto?'<div class="blife-auto">sensor-driven (manual override)</div>':'';
  if(!can("op_batch")){
    if(s==="running") return `<div class="blife-meta">started ${esc(dmyt(b.startedAt||""))}${b.startedBy?" · "+esc(b.startedBy):""}</div>`;
    if(s==="done")    return `<div class="blife-meta">done ${esc(dmyt(b.completedAt||""))}${b.completedBy?" · "+esc(b.completedBy):""}</div>`;
    return '<span class="muted">—</span>';
  }
  if(s==="planned")
    return `<button class="blifebtn go" onclick="setBatchStatus('${esc(b.id)}','running')"><span class="material-symbols-rounded">play_arrow</span>Start</button>${autoNote}`;
  if(s==="running")
    return `<button class="blifebtn go" onclick="setBatchStatus('${esc(b.id)}','done')"><span class="material-symbols-rounded">check</span>Complete</button>`

    wireLotPicker(row.querySelector(".b-lot"), { filterFn: (l)=>mpLotFilter(l,row),
      onSelect: ()=>{ mpLockQuality(); mpPrefillRow(row); mpEditorSync(); } });
    row.querySelector(".b-mtr").addEventListener("input",()=>mpEditorSuggestWeight(row));
    row.querySelector(".b-mtr").addEventListener("change",()=>{ mpSnapRow(row); mpEditorSync(); });
  }
  mpEditorSync();
}
function mpPrefillRow(row){                       // start from what is still LEFT in the lot, then snap to takas
  const id=lotPickVal(row.querySelector(".b-lot")); if(!id) return;
  if(mpWfActive()){                               // step-aware: what's still open for this step
    const nos=nosOpenForStep(id, mpStepNode(), MP_EDIT&&MP_EDIT.editId), mo=lotNoMeters(id);
    const rem=Math.round(nos.reduce((a,n)=>a+(+mo[n]||0),0));
    const mtr=row.querySelector(".b-mtr"); mtr.value=rem||""; mtr.max=rem||undefined;
    row.querySelector(".b-pcs").max=nos.length||undefined;
    mpSnapRow(row); return;
  }
  const a=lotAllocation(id); if(!a) return;
  row.querySelector(".b-mtr").value=a.remaining||"";
  row.querySelector(".b-mtr").max=a.remaining||undefined;
  row.querySelector(".b-pcs").max=a.remainingPcs||undefined;
  mpSnapRow(row);
}
function mpSnapRow(row){                           // a taka cannot be cut: round the ask up to whole takas
  const id=lotPickVal(row.querySelector(".b-lot")), out=row.querySelector(".taka-pick");
  const want=+row.querySelector(".b-mtr").value||0;
  if(!id||!want){ row.dataset.takas="[]"; delete row.dataset.takaNos; if(out) out.innerHTML=""; return; }
  if(mpWfActive()){                                // step-aware pick: choose specific takas open for this step
    const nos=nosOpenForStep(id, mpStepNode(), MP_EDIT&&MP_EDIT.editId), mo=lotNoMeters(id);
    const pk=pickNos(nos, mo, want);
    row.dataset.takas=JSON.stringify(pk.takas); row.dataset.takaNos=JSON.stringify(pk.takaNos);
    row.querySelector(".b-pcs").value=pk.pcs; row.querySelector(".b-mtr").value=pk.total;
    mpEditorSuggestWeight(row);
    if(out){
      const q=(document.getElementById("mp_q")||{}).value||"";
      const unc=nosUnclearedFor(id,q,mpStepNode(),pk.takaNos,MP_EDIT&&MP_EDIT.editId);
      if(!pk.takas.length){ out.innerHTML='<span class="flag">nothing available for this step</span>'; }
      else out.innerHTML='<span class="material-symbols-rounded">straighten</span> <b>'+pk.pcs+'</b> takas &middot; <b class="tnum">'+pk.total+' m</b>'
        +(pk.short?' <span class="flag">short by '+(want-pk.total)+' m — nothing more available</span>':'')
        +(unc.length?' <span class="flag"><span class="material-symbols-rounded" style="font-size:15px;vertical-align:-3px">priority_high</span>'+unc.length+' taka(s) not yet '+esc(mpPriorName()||'processed')+' — that step is unplanned</span>':'');
    }
    return;
  }
  const pick=pickTakas(lotRemainingTakas(id), want);
  row.dataset.takas=JSON.stringify(pick.takas);
  delete row.dataset.takaNos;                      // re-snapped by meters; the taka picker re-sets precise Sr. Nos. if used
  row.querySelector(".b-pcs").value=pick.pcs;
  row.querySelector(".b-mtr").value=pick.total;
  mpEditorSuggestWeight(row);
  if(!out) return;
  if(!pick.takas.length){ out.innerHTML='<span class="flag">nothing left in this lot</span>'; return; }
  const over=pick.total-want;
  out.innerHTML='<span class="material-symbols-rounded">straighten</span>'
    +'<b>'+pick.pcs+'</b> whole takas &middot; '+pick.takas.join(' + ')+' = <b class="tnum">'+pick.total+' m</b>'
    +(pick.short?' <span class="flag">only '+pick.total+' m left — short by '+(want-pick.total)+' m</span>'
      :over>0?' <span class="muted">(asked '+want+' m; +'+over+' m — takas cannot be cut)</span>':'');
}

async function mpSaveNew(machineId){

  if(hasWorkflow(q) && !mpStepNode()){ toast("Pick a process step"); return; }
  if(!editing && !wfOn) for(const r of rows){ const a=lotAllocation(r.lotId);   // legacy consumption guard (non-workflow only)
    if(a.blocked){ toast(r.lotId+" is fully used"); return; }

  if(custs.length>1){ toast("One customer per batch — this mixes "+custs.join(" & ")); return; }
  const tot={pcs:rows.reduce((a,r)=>a+r.pcs,0), mtr:Math.round(rows.reduce((a,r)=>a+r.mtr,0)),
             weight:Math.round(rows.reduce((a,r)=>a+r.weight,0)*10)/10};

  const stepNode = wfOn?mpStepNode():((ex&&ex.stepNode)||"");

  if(ex){ row.id=ex.id; if(ex.startedAt) row.startedAt=ex.startedAt; if(ex.planDay) row.planDay=ex.planDay;
    if(ex.ph!=null) row.ph=ex.ph;                          // PH is edited in the time modal now — don't drop it on batch edit
    if(ex.completedAt) row.completedAt=ex.completedAt; if(ex.startedBy) row.startedBy=ex.startedBy; if(ex.completedBy) row.completedBy=ex.completedBy;
    ["actInTime","actOutTime","plcProgram","plcIn","plcOut"].forEach(k=>{ if(ex[k]!=null) row[k]=ex[k]; }); }
  const res=await API.save("batches", row);
  if(res && res.error){ toast(res.error); return; }

function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function _ymd(x){ return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function todayStr(){ return _ymd(new Date()); }                                   // local date, not UTC
function nextDay(d){ const p=d.split("-").map(Number); return _ymd(new Date(p[0],p[1]-1,p[2]+1)); }  // TZ-safe next day
function _splitDT(s){ s=s?String(s):""; const p=s.replace("T"," ").split(" "); return {d:p[0]||"", t:(p[1]||"").slice(0,5)}; }
/* ---- drag to reorder batches within a machine; commit only on a 3-second hold ---- */
let MP_DRAG=null;
function mpDragStart(e){ const tr=e.target.closest('tr'); MP_DRAG=tr; if(tr) tr.classList.add('mp-dragging');
  if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', (tr&&tr.dataset.bid)||''); }catch(_){} } }
function mpDragOver(e){ if(!MP_DRAG) return; const tr=e.target.closest('tr[data-bid]');
  if(!tr || tr===MP_DRAG || tr.dataset.mid!==MP_DRAG.dataset.mid) return;    // reorder only within the same machine
  e.preventDefault();
  const r=tr.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
  tr.parentNode.insertBefore(MP_DRAG, after?tr.nextSibling:tr); }
function mpDrop(e){ if(!MP_DRAG) return; e.preventDefault(); mpOrderDirty(); }
function mpDragEnd(){ if(MP_DRAG) MP_DRAG.classList.remove('mp-dragging'); MP_DRAG=null; }
function mpOrderDirty(){ const b=document.getElementById('mp_saveorder'); if(b) b.style.display='';
  const byM={}; document.querySelectorAll('#mp_body tr[data-bid]').forEach(tr=>{ (byM[tr.dataset.mid]=byM[tr.dataset.mid]||[]).push(tr); });
  Object.values(byM).forEach(list=>list.forEach((tr,i)=>{ const c=tr.querySelector('td'); if(c) c.textContent=i+1; }));   // live seq preview
}
let _mpHold=null;
function mpHoldStart(e){ if(e&&e.preventDefault) e.preventDefault();

function mpHoldCancel(){ if(_mpHold){ clearTimeout(_mpHold); _mpHold=null; }

/* ---------- storage map ---------- */
/* ---------- storage: Area → Shelves → rows×cols cells, each with a kg capacity ---------- */
function qualityTint(name, alpha){                 // stable pastel per quality so a cell's fabric reads at a glance
  if(alpha===undefined) alpha=1;
  if(!name) return "hsla(220,12%,90%,"+alpha+")";
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return "hsla("+(h%360)+",50%,85%,"+alpha+")";
}
function shelvesFor(areaName){ return (DB.shelves||[]).filter(s=>s.area===areaName); }
function shelfById(id){ return (DB.shelves||[]).find(s=>s.id===id); }
function cellSlots(shelfId,row,col){ return (DB.storageSlots||[]).filter(s=>s.shelf===shelfId && +s.row===+row && s.col===col); }
function cellUsed(shelfId,row,col){ return cellSlots(shelfId,row,col).reduce((a,s)=>a+(+s.weightKg||0),0); }

    document.getElementById("stg_note").textContent="0 shelves"; return;
  }
  let totCells=0, occCells=0, html='';
  shelves.forEach(sh=>{
    const cols=+sh.cols||1, rows=+sh.rows||1, cap=+sh.cellCapKg||0; totCells+=cols*rows;
    html+='<div class="stg-shelf"><div class="stg-shelf-h"><b class="tnum">'+esc(sh.name)+'</b>'

        const sl=cellSlots(sh.id,r,col), used=cellUsed(sh.id,r,col);

        const pct=cap?Math.min(100,Math.round(used/cap*100)):0;
        const lab=esc(sh.name)+" "+r+col+(occ?(" — "+sl.length+" lot(s), "+Math.round(used)+" kg"):" — empty");
        html+='<button type="button" class="stg-cell'+(occ?" occ":"")+'" style="'+(occ?"background:"+qualityTint(lot&&lot.quality):"")+'" aria-label="'+lab+'" title="'+lab+'" onclick="openCellModal(\''+sh.id+'\','+r+',\''+col+'\')">'
          +'<span class="stg-cc">'+r+col+'</span>'
          +(occ?'<span class="stg-tag">'+esc(sl[0].lotId)+(sl.length>1?" +"+(sl.length-1):"")+'</span><span class="stg-cap"><i style="width:'+pct+'%"></i></span>':'')
          +'</button>';
      }
    }
    html+='</div></div>';
  });
  document.getElementById("stg_note").textContent=occCells+" of "+totCells+" cells occupied · "+shelves.length+" shelves";
  grid.innerHTML=html;
}
document.addEventListener("change", e=>{ if(e.target && e.target.id==="stg_area") paintStorageGrid(e.target.value); });

function openCellModal(shelfId,row,col){
  const sh=shelfById(shelfId); if(!sh) return;
  const cap=+sh.cellCapKg||0, edit=can("op_storage");
  const ex=document.getElementById("cellOverlay"); if(ex) ex.remove();
  const sl=cellSlots(shelfId,row,col), used=cellUsed(shelfId,row,col), left=Math.max(0,cap-used);
  const list = sl.length ? sl.map(s=>{ const lot=(DB.lots||[]).find(l=>l.id===s.lotId);
      return '<div class="cell-lot"><span class="swatch" style="background:'+qualityTint(lot&&lot.quality)+'"></span>'
        +'<span class="cell-lot-b"><b>'+esc(s.lotId)+'</b><small>'+esc((lot&&lot.quality)||"no quality")+'</small></span>'
        +'<span class="tnum">'+(+s.weightKg||0)+' kg</span>'
        +(edit?'<button class="btn danger sm" title="remove" onclick="removeCellSlot(\''+s.id+'\',\''+shelfId+'\','+row+',\''+col+'\')"><span class="material-symbols-rounded">delete</span></button>':'')
        +'</div>'; }).join("")
    : '<div class="muted" style="padding:8px 2px">Empty cell.</div>';
  const o=document.createElement("div"); o.id="cellOverlay"; o.className="modal-bg on";
  o.innerHTML='<div class="modal" style="width:520px;max-width:94vw">'
    +'<div class="m-h"><h3><span class="material-symbols-rounded">shelves</span>'+esc(sh.name)+' &middot; cell '+row+col+'</h3><button class="x" onclick="this.closest(\'.modal-bg\').remove()">&times;</button></div>'
    +'<div class="m-b">'
    +'<div class="cell-cap"><span class="lbl">Capacity</span><span class="cell-cap-bar"><i style="width:'+(cap?Math.min(100,Math.round(used/cap*100)):0)+'%"></i></span><span class="tnum">'+Math.round(used)+' / '+cap+' kg</span></div>'
    +'<div class="cell-lots">'+list+'</div>'
    +(edit?('<div class="cell-add"><div class="fldlabel">Add a lot to this cell <span class="small muted">— '+Math.round(left)+' kg free</span></div>'
      +'<div class="cell-add-row">'+lotPickerHTML("","cell-lot-pick")+'<input class="cell-wt" type="number" min="0" step="0.1" placeholder="kg"><button class="btn sm" id="cellAddBtn"><span class="material-symbols-rounded">add</span>Place</button></div></div>'):'')
    +'</div>'
    +'<div class="m-f"><button class="btn ghost" onclick="this.closest(\'.modal-bg\').remove()">Close</button></div></div>';
  document.body.appendChild(o);
  const pick=o.querySelector(".cell-lot-pick");
  if(pick){
    wireLotPicker(pick, { onSelect:()=>{ const id=lotPickVal(pick), lot=(DB.lots||[]).find(l=>l.id===id); const wt=o.querySelector(".cell-wt"); if(lot && wt) wt.value=+lot.weight||""; } });
    o.querySelector("#cellAddBtn").onclick=()=>saveCellLot(shelfId,row,col);
  }
}
async function saveCellLot(shelfId,row,col){
  const sh=shelfById(shelfId), cap=+sh.cellCapKg||0;
  const pick=document.querySelector("#cellOverlay .cell-lot-pick"), lotId=lotPickVal(pick);
  if(!lotId){ toast("Pick a lot"); return; }
  const w=+document.querySelector("#cellOverlay .cell-wt").value||0;
  const dup=(DB.storageSlots||[]).find(s=>s.lotId===lotId);
  if(dup){ const ds=shelfById(dup.shelf); toast(lotId+" is already stored at "+((ds&&ds.name)||dup.shelf)+" "+dup.row+dup.col); return; }
  const used=cellUsed(shelfId,row,col);
  if(cap && used+w>cap){ toast("Over capacity — cell holds "+cap+" kg, only "+Math.round(cap-used)+" kg free"); return; }
  const res=await API.save("storageSlots",{area:sh.area, shelf:shelfId, row:+row, col:col, lotId:lotId, weightKg:w});
  if(res && res.error){ toast(res.error); return; }
  await API.db(); toast(lotId+" placed at "+sh.name+" "+row+col); openCellModal(shelfId,row,col); paintStorageGrid(sh.area);
}
async function removeCellSlot(slotId,shelfId,row,col){
  const res=await API.del("storageSlots",slotId);
  if(res && res.error){ toast(res.error); return; }
  const sh=shelfById(shelfId);
  await API.db(); toast("Removed from cell"); openCellModal(shelfId,row,col); if(sh) paintStorageGrid(sh.area);
}

function exportScheduleToExcel(){
  if(!S) return;
  const header=["Machine","Type","Kind","Batch","Order","Start (t+min)","Duration (min)","Step"];
  const body=[];
  DB.machines.forEach(m=>{
    (S.tl[m.id].blocks||[]).forEach(b=>{
      body.push([m.id, m.type, b.kind, b.batch?b.batch.batchId:"", b.batch?b.batch.order:"", b.start, b.mins, b.step||""]);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet([header].concat(body));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Schedule");
  XLSX.writeFile(wb, "Schedule_"+new Date().toISOString().slice(0,10)+".xlsx");
}

const TABMAP={floor:"op_floor",sched:"op_schedule",storage:"op_storage",massplan:"op_massplan"};
boot(()=>{
  renderStorageMap();
  // show only the section tabs this role may see
  const allowed=Object.keys(TABMAP).filter(s=>can(TABMAP[s]));
  document.querySelectorAll('#secTabs button').forEach(b=>{ b.style.display=allowed.includes(b.dataset.s)?"":"none"; });
  if(!allowed.length){
    document.querySelector('main').innerHTML='<div class="page-head"><h1>No operations access</h1><p>Your role has no operations pages assigned. Open the <a href="admin.html">Admin</a> console, or ask an administrator to grant access.</p></div>';
    return;
  }
  draw();
  if(!allowed.includes('floor')) show(allowed[0]);
  // keep the board live: re-anchor the plan to the wall clock every few minutes so it moves forward
  setInterval(()=>{ if(document.getElementById("gantt")) draw(); }, 3*60000);
  startAutoSync(function(){                        // ~4s live sync of ONLY the passive live views
    const on=document.querySelector('#secTabs button.on'); const s=on?on.dataset.s:'floor';
    if(s==='floor' || s==='sched') draw();         // machine cards + gantt stay live; builder tabs (batch maker,
                                                   // batch planner, storage) are left alone so nothing resets
  });
});
</script>
