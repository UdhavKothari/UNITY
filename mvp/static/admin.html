<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REL-UNITY — Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
.wf-qedit{display:flex;flex-direction:column;gap:10px}
.qwf-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qwf-sel{max-width:340px}
.qwf-strip{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.qwf-node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:92px}
.qwf-tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qwf-tile .material-symbols-rounded{font-size:26px}
.qwf-nm{font-size:12px;font-weight:600;text-align:center;line-height:1.15;color:var(--ink)}
.qwf-tin{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:3px 7px}
.qwf-time{width:50px;border:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;text-align:right;color:var(--ink)}
.qwf-time:focus{outline:none}
.qwf-u{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.qwf-arrow{align-self:center;margin-top:14px;color:var(--faint);font-size:22px}
.qwf-empty{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:12px}
.qwf-empty .material-symbols-rounded{font-size:20px;color:var(--accent)}
</style>
</head>

<script>
const MTYPES=["drum","jigger","jet","stentor","hydro","rope"];
const PTYPES=["","drum","jigger","jet"];
const AUTHS=["","drum","jigger","jet","stentor"];
const MCTYPES=["","drum","jigger","jet","stentor","hydro","rope"];
const UNITS=["g/l","%"];
const FAMILIES=["Neutral","Blue","Red","Yellow","Green","Purple"];
const MAX_TAKAS=50;

/* --- icons (Google Material Symbols) --- */
function ic(name){
  const M={
    dashboard:"grid_view", machines:"precision_manufacturing", qualities:"layers",
    shadeRecipes:"palette", customers:"groups",
    orders:"receipt_long", storageAreas:"inventory_2", shelves:"shelves", storageSlots:"grid_view", suppliers:"local_shipping",
    operators:"badge", qcMetrics:"verified", users:"person",
    roles:"admin_panel_settings", plan:"calendar_view_week", settings:"tune",
    batches:"widgets", lots:"qr_code_2", weavers:"factory", recipes:"science",
    activity:"history", takaMaster:"tag", history:"manage_history", challans:"mail", lotHistory:"timeline"
  };
  return '<span class="material-symbols-rounded">'+(M[name]||"circle")+'</span>';
}

/* --- schemas: fields carry section (sec), type (t), help, req, min, max --- */
const SCHEMAS={
  machines:{label:"Machines",single:"machine",

    search:["id","name","type","company"],

      {k:"id",l:"MC ID",sec:"Identity",req:true,help:"Short code, e.g. JET-1"},
      {k:"name",l:"MC Name",sec:"Identity",req:true},
      {k:"type",l:"Type",sec:"Identity",t:"select",o:MTYPES,req:true},
      {k:"company",l:"Maker / company",sec:"Identity"},
      {k:"capMin",l:"Capacity min (kg)",sec:"Capacity & process",t:"number",min:0},

      {k:"plc",l:"PLC connected",sec:"Capacity & process",t:"bool"},

      {k:"next24",l:"Next 24h requirement",sec:"Stock",t:"number",min:0},
      {k:"procureSize",l:"Procurement size",sec:"Stock",t:"number",min:0}]},
  batches:{label:"Batch maker",single:"batch",
    cols:[["id","Batch ID"],["lotIds","Lot No."],["pcs","Pcs"],["mtr","Mtr"],["weight","Wt (kg)"],["quality","Quality"],["shadeNo","Shade no."],["mcPin","M/C No"],["inTime","In"],["outTime","Out"],["ph","pH"],["operator","Operator"],["shift","Shift"],["urgent","Urgent"],["status","Status"]],

      {k:"operator",l:"Operator",sec:"Process",t:"opsel",help:"Batch is allocated to this operator"},

      {k:"inDate",l:"In date",sec:"Lot",t:"date"},
      {k:"inTime",l:"In time",sec:"Lot",t:"time",help:"When the lot physically came in"},
      {k:"location",l:"Storage location",sec:"Lot",help:"Where this fabric physically sits (area / shelf / row / column)"},
      {k:"status",l:"Status",sec:"Lot",t:"select",o:["in-stock","allocated","consumed"]},
      {k:"totalMeters",l:"Lot total",sec:"Takas (up to 50) - usually 80-120 m each",t:"lotTotal",help:"Worked out from the taka lengths - cannot be typed"},

      {k:"weight",l:"Greige weight (kg)",sec:"Takas (up to 50) - usually 80-120 m each",t:"number",min:0,step:0.1,help:"Total weight of this lot. Lets the quality's GSM be derived in Qualities → Quick add (GSM = kg × 1000 ÷ (meters × width))"},

function colorFT(family,tone){
  const map={Blue:212,Red:2,Yellow:44,Neutral:222,Green:140,Purple:280};
  const hue=map[family]!==undefined?map[family]:222;
  const sat=family==="Neutral"?6:62; const light=86-(+tone||0)*5.4;
  return "hsl("+hue+","+sat+"%,"+light+"%)";
}

function cellVal(table,r,k){
  if(table==="challans" && k==="status"){
    const s=r.status||"", cls=s==="linked"?"run":s==="ignored"?"wash":"free";
    return '<span class="pill '+cls+'">'+esc(s==="inward-pending"?"inward pending":s)+'</span>';
  }
  if(table==="challans" && k==="lotId") return r.lotId?'<span class="tnum">'+esc(r.lotId)+'</span>':'<span class="muted">—</span>';
  if(k==="sw") return '<input type="color" class="sw-pick" value="'+shadeColorHex(r)+'" title="Click to pick a custom colour for this shade" onclick="event.stopPropagation()" onchange="setShadeHex('+JSON.stringify(r.id)+',this.value)">';
  if(k==="shades") return (r.lines||[]).map(l=>esc(l.shade)+" ("+l.m+"m)").join(", ");
  if(k==="plc") return r.plc?"Yes":"";
  if(k==="active") return r.active?'<span class="pill run">Active</span>':'<span class="pill free">Disabled</span>';
  if(k==="route"){
    if(r.workflowId){ const w=(DB.workflows||[]).find(x=>x.id===r.workflowId); return w?('<span class="tnum">'+esc(w.name||"flow")+'</span>'):'<span class="muted">missing flow</span>'; }
    const p=[]; for(let i=1;i<=4;i++){ const mc=r["step"+i+"_mc"]; if(!mc) continue;
      const sp=+r["step"+i+"_speed"]||0, lbl=esc(mc)+(mc==="stentor"&&sp?(' <span class="muted">'+sp+'m/min</span>'):'');
      p.push((i===(+r.dyeStep||3))?'<b>'+lbl+'</b>':lbl); }
    return p.join(' <span class="muted">&rarr;</span> ')||'<span class="muted">no route</span>';
  }
  if(k==="maintDue"){
    const d=r.schedMaint; if(!d) return '<span class="muted">&mdash;</span>';
    const days=Math.round((new Date(d)-new Date())/86400000);
    if(days<0) return '<span class="pill maint">overdue</span> <span class="tnum">'+esc(dmy(d))+'</span>';
    if(days<=7) return '<span class="pill pre">'+days+'d</span> <span class="tnum">'+esc(dmy(d))+'</span>';
    return '<span class="tnum">'+esc(dmy(d))+'</span>';
  }
  if(k==="auxSummary"){
    const a=r.aux||[]; if(!a.length) return '<span class="muted">&mdash;</span>';
    return a.slice(0,3).map(x=>'<span class="chip">'+esc(x.name)+' '+esc(x.qty)+esc(x.unit)+'</span>').join("")+(a.length>3?' <span class="muted">+'+(a.length-3)+'</span>':'');
  }
  if(k==="allocation"){
    const a=lotAllocation(r.id);
    if(!a.used) return '<span class="pill run">available</span> <span class="tnum">'+a.total+'</span> <span class="muted">m</span>';
    if(a.blocked) return '<span class="pill free">fully used</span> <span class="tnum">'+esc(a.batches.join(", "))+'</span>';
    return '<span class="pill pre">part used</span> <span class="tnum">'+a.remaining+'</span> <span class="muted">m left of '+a.total+'</span>';
  }
  if(k==="urgent") return r.urgent?'<span class="pill maint">urgent</span>':'';
  if(k==="permsCount") return (r.perms||[]).length+" view · "+(Array.isArray(r.edit)?r.edit.length:(r.perms||[]).length)+" edit";
  if(k==="shadeFamilies") return (r.shadeFamilies||[]).length ? (r.shadeFamilies||[]).map(f=>'<span class="chip">'+esc(f)+'</span>').join("") : '<span class="muted">&mdash;</span>';
  if(k==="takaCount") return '<span class="tnum">'+((r.takas||[]).length)+'</span>';
  if(k==="lotCount") return '<span class="tnum">'+((DB.lots||[]).filter(l=>l.weaver===r.name).length)+'</span>';
  if(k==="lotMeters"){ const t=(r.takas||[]).map(Number).filter(n=>!isNaN(n)); return t.length?('<span class="tnum">'+Math.round(t.reduce((a,b)=>a+b,0))+'</span> <span class="muted">m</span>'):'<span class="muted">&mdash;</span>'; }
  if(k==="lotIds"){ const l=r.lotIds||[]; return l.length? l.map(x=>'<span class="chip">'+esc(x)+'</span>').join("") : '<span class="muted">—</span>'; }
  if(k==="shift" && r.shift) return '<span class="pill '+(r.shift==="Night"?"wash":"pre")+'">'+esc(r.shift)+'</span>';
  const _fld=((SCHEMAS[table]&&SCHEMAS[table].fields)||[]).find(f=>f.k===k);   // date fields render DD/MM/YYYY
  if(_fld && _fld.t==="date" && r[k]) return '<span class="tnum">'+esc(dmy(r[k]))+'</span>';
  if(_fld && (_fld.t==="datetime"||_fld.t==="datetime-local") && r[k]) return '<span class="tnum">'+esc(dmyt(r[k]))+'</span>';
  return esc(r[k]);
}
const _textCache=document.createElement("div");
function cellText(table,r,k){
  _textCache.innerHTML=cellVal(table,r,k);
  return (_textCache.textContent||"").trim();
}
function exportTableToExcel(table){
  const sc=SCHEMAS[table], rows=DB[table]||[];
  const header=sc.cols.map(x=>x[1]);
  const body=rows.map(r=>sc.cols.map(x=>cellText(table,r,x[0])));
  const ws=XLSX.utils.aoa_to_sheet([header].concat(body));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sc.label.slice(0,31));
  XLSX.writeFile(wb, sc.label.replace(/[^a-z0-9]+/gi,"_")+"_"+new Date().toISOString().slice(0,10)+".xlsx");
}
const SORT={};
function toggleSort(k){
  const cur=SORT[CUR];
  if(cur && cur.k===k) SORT[CUR]= cur.dir==="asc" ? {k,dir:"desc"} : null;
  else SORT[CUR]={k,dir:"asc"};
  PAGENO[CUR]=0;                     // sorting changes order — back to first page
  render();
}

let _searchDebounce=null;
function onSearchInput(el){
  SEARCH[CUR]=el.value;
  PAGENO[CUR]=0;                     // a new search starts at the first page
  clearTimeout(_searchDebounce);
  _searchDebounce=setTimeout(()=>{
    render();
    const i=document.querySelector('.search input');
    if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  }, 150);
}

function render(){
  const c=document.getElementById("content");
  if(!can(CUR)){ c.innerHTML='<div class="page-head"><h1>No access</h1><p>You do not have permission to view this page. Ask an administrator to grant it to your role.</p></div>'; return; }
  if(CUR==="dashboard") return renderDashboard(c);
  if(CUR==="settings") return renderSettings(c);
  if(CUR==="plan") return renderPlan(c);
  if(CUR==="activity") return renderActivity(c);
  if(CUR==="history") return renderBatchHistory(c);
  if(CUR==="lotHistory") return renderLotHistory(c);
  if(CUR==="takaMaster") return renderTakaMaster(c);
  if(CUR==="recipes") return renderRecipes(c);
  const sc=SCHEMAS[CUR];
  const term=(SEARCH[CUR]||"").toLowerCase();
  const colKeys=sc.cols.map(x=>x[0]);
  let rows=DB[CUR]||[];
  // a linked challan's fabric is already inward — it's no longer pending, so drop it from this list
  if(CUR==="challans") rows=rows.filter(r=>(r.status||"inward-pending")!=="linked");
  const baseTotal=rows.length;                 // record count after the status filter, before search
  // search every visible column (the rendered text, not just a hand-picked subset of raw fields)
  if(term) rows=rows.filter(r=>colKeys.some(k=>cellText(CUR,r,k).toLowerCase().indexOf(term)>=0));
  const st=SORT[CUR];
  if(st){
    rows=rows.slice().sort((a,b)=>{
      const av=cellText(CUR,a,st.k), bv=cellText(CUR,b,st.k);
      const an=parseFloat(av.replace(/,/g,"")), bn=parseFloat(bv.replace(/,/g,""));
      const c=(av!==""&&bv!==""&&!isNaN(an)&&!isNaN(bn)) ? (an-bn) : av.localeCompare(bv,undefined,{sensitivity:"base",numeric:true});
      return st.dir==="desc" ? -c : c;
    });
  }
  const mayEdit=canEdit(CUR);
  // paginate: show PAGE_SIZE (200) rows per page and stop — Prev/Next to move, search/sort to narrow
  const total=rows.length;
  const pages=Math.max(1, Math.ceil(total/PAGE_SIZE));
  let p=PAGENO[CUR]||0; if(p>pages-1) p=pages-1; if(p<0) p=0; PAGENO[CUR]=p;
  const start=p*PAGE_SIZE, endi=Math.min(total, start+PAGE_SIZE);
  const pageRows=rows.slice(start, endi);
  c.innerHTML='<div class="page-head"><h1>'+sc.label+'</h1><p>'+baseTotal+' record(s). '+(mayEdit?'Click Edit to change, or Add to create a new one.':'You have view-only access to this page.')+'</p></div>'
    +'<div class="toolbar"><div class="search"><span class="material-symbols-rounded">search</span>'
    +'<input placeholder="Search '+sc.label.toLowerCase()+'..." value="'+esc(SEARCH[CUR]||"")+'" oninput="onSearchInput(this)"></div>'
    +'<div class="spacer"></div>'
    +((CUR==="lots" && can("challans")) ? '<button class="btn ghost" onclick="openInwardPending()"><span class="material-symbols-rounded">local_shipping</span>Inward pending</button>' : '')
    +((CUR==="lots" && (canEdit("qualities")||canEdit("shadeRecipes"))) ? '<button class="btn ghost" onclick="syncCatalog()"><span class="material-symbols-rounded">sync</span>Sync qualities &amp; shades</button>' : '')
    +(mayEdit&&CUR==="challans" ? '<button class="btn ghost" onclick="reconcileChallans()"><span class="material-symbols-rounded">link</span>Reconcile now</button>' : '')
    +(mayEdit&&CUR==="qualities" ? '<button class="btn ghost" onclick="openQualityQuickAdd()"><span class="material-symbols-rounded">playlist_add</span>Quick add</button>' : '')
    +(mayEdit&&CUR==="qualities" ? '<button class="btn ghost" onclick="openMergeQualities()"><span class="material-symbols-rounded">merge</span>Merge</button>' : '')
    +(CUR==="qualities" && can("op_workflows") ? '<button class="btn ghost" onclick="openWorkflowsModal()"><span class="material-symbols-rounded">account_tree</span>Workflows</button>' : '')
    +(mayEdit&&BULK_ADD_TABLES.includes(CUR) ? '<button class="btn ghost" onclick="openBulkAdd(\''+CUR+'\')"><span class="material-symbols-rounded">playlist_add</span>Bulk add</button>' : '')
    +(mayEdit ? '<button class="btn" onclick="openModal(CUR,null)">+ Add '+sc.single+'</button>' : '')
    +dataMenu(CUR)+'</div>'
    +'<div class="card"><div class="tbl-wrap"><table><thead><tr>'+sc.cols.map(x=>'<th class="sortable'+(st&&st.k===x[0]?" sort-"+st.dir:"")+'" onclick="toggleSort(\''+x[0]+'\')">'+x[1]
      +(st&&st.k===x[0]?' <span class="material-symbols-rounded sort-ic">'+(st.dir==="asc"?"arrow_upward":"arrow_downward")+'</span>':'')+'</th>').join("")+'<th></th></tr></thead><tbody>'
    +(total?pageRows.map(r=>rowHTML(CUR,sc,mayEdit,r)).join("")
      :'<tr><td colspan="'+(sc.cols.length+1)+'" style="text-align:center;color:var(--muted);padding:26px">No records'+(term?' match your search':'')+'.</td></tr>')
    +'</tbody></table></div>'+pagerHTML(CUR,total,pages,p,start,endi)+'</div>';
}
const PAGE_SIZE=200;                 // load 200 rows per page and stop; page/search for more
let PAGENO={};                       // current page index per table
/* one "Excel" button with an Import / Export drop-down (keeps toolbars compact) */
function dataMenu(cur){
  const canImp = canEdit(cur) && cur==="lots";      // pages that have an Excel importer

function toggleDD(btn){ const m=btn.nextElementSibling, open=m.classList.contains("on");
  document.querySelectorAll(".dd-menu.on").forEach(x=>x.classList.remove("on")); if(!open) m.classList.add("on"); }
function closeDD(el){ const m=el.closest(".dd-menu"); if(m) m.classList.remove("on"); }
document.addEventListener("click",e=>{ if(!e.target.closest(".ddwrap")) document.querySelectorAll(".dd-menu.on").forEach(x=>x.classList.remove("on")); });
function rowHTML(cur,sc,mayEdit,r){
  return '<tr class="'+((sc.rowClass&&sc.rowClass(r))||"")+'">'+sc.cols.map(x=>'<td>'+cellVal(cur,r,x[0])+'</td>').join("")
    +'<td><div class="rowbtns">'
    +(cur==="batches"?'<button class="btn ghost sm" onclick=\'showBatchHistory('+JSON.stringify(r.id)+')\'>History</button>':'')
    +(mayEdit?'<button class="btn ghost sm" onclick=\'openModal("'+cur+'",'+JSON.stringify(r.id)+')\'>Edit</button>':'')
    +(mayEdit?'<button class="btn danger sm" onclick=\'delRow("'+cur+'",'+JSON.stringify(r.id)+')\'>Delete</button>':'')
    +(mayEdit?'':'<span class="muted small">view only</span>')
    +'</div></td></tr>';
}
function pagerHTML(cur,total,pages,p,start,endi){
  if(!total) return '';
  let h = '<div class="pager">'
    +'<button class="btn ghost sm" '+(p<=0?'disabled':'')+' onclick="pageStep(\''+cur+'\',-1)"><span class="material-symbols-rounded">chevron_left</span>Prev</button>'
    +'<span class="pager-info">Showing '+(start+1)+'–'+endi+' of '+total+' &middot; Page '+(p+1)+' / '+pages+'</span>'
    +'<button class="btn ghost sm" '+(p>=pages-1?'disabled':'')+' onclick="pageStep(\''+cur+'\',1)">Next<span class="material-symbols-rounded">chevron_right</span></button>';
  if(pages>1){                    // jump straight to any page number
    h += '<span class="pager-jump" style="display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:13px;color:var(--muted)">Go to'
      + '<input type="number" min="1" max="'+pages+'" value="'+(p+1)+'" aria-label="Page number"'
      + ' style="width:64px;padding:6px 8px;border:1px solid var(--line-2,#dbe1ea);border-radius:8px;font-family:\'IBM Plex Mono\',monospace;text-align:center"'
      + ' onkeydown="if(event.key===\'Enter\'){pageGo(\''+cur+'\',this.value,'+pages+');event.preventDefault();}"'
      + ' onchange="pageGo(\''+cur+'\',this.value,'+pages+')">'
      + '<span>/ '+pages+'</span></span>';
  }
  return h + '</div>';
}
function pageStep(cur,d){ PAGENO[cur]=(PAGENO[cur]||0)+d; render(); const m=document.querySelector('main'); if(m) m.scrollTop=0; window.scrollTo({top:0}); }
function pageGo(cur,val,pages){    // 1-based input -> 0-based page index, clamped
  let n=parseInt(val,10); if(isNaN(n)) return;
  n=Math.max(1,Math.min(pages,n));
  PAGENO[cur]=n-1; render();
  const m=document.querySelector('main'); if(m) m.scrollTop=0; window.scrollTo({top:0});
}

/* ---- activity log (console history): every event, newest first, searchable ---- */
const ACTION_LABEL={login:"signed in",logout:"signed out",create:"created",update:"updated",
  delete:"deleted",running:"started batch",done:"completed batch",planned:"reopened batch",
  reset:"reset data",changePassword:"changed password"};
let _logState={offset:0,total:0,q:"",loading:false,done:false};
function logRowHTML(e){
  return '<tr><td class="tnum">'+esc(dmyt(e.ts))+'</td><td><b>'+esc(e.user)+'</b></td>'
    +'<td><span class="pill '+actionPill(e.action)+'">'+esc(ACTION_LABEL[e.action]||e.action)+'</span></td>'

}
function renderActivity(c){
  const term=(SEARCH.activity||"");
  c.innerHTML='<div class="page-head"><h1>Activity log</h1><p id="logHead">Loading…</p></div>'
    +'<div class="toolbar"><div class="search"><span class="material-symbols-rounded">search</span>'
    +'<input placeholder="Search the log..." value="'+esc(term)+'" oninput="onSearchInput(this)"></div>'
    +'<div class="spacer"></div>'
    +'<button class="btn ghost" onclick="exportActivityToExcel()"><span class="material-symbols-rounded">download</span>Export</button></div>'
    +'<div class="card"><div class="tbl-wrap big-scroll" id="logScroll" onscroll="logOnScroll(event)"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Table</th><th>Record</th><th>Detail</th></tr></thead><tbody id="logBody"></tbody></table></div><div class="big-foot" id="logFoot"></div></div>';
  _logState={offset:0,total:0,q:term,loading:false,done:false};
  logLoadMore(true);
}
async function logLoadMore(reset){
  if(_logState.loading||_logState.done) return;
  _logState.loading=true;
  const res=await API._post({op:"logPage", q:_logState.q, offset:_logState.offset, limit:150});
  _logState.loading=false;
  const body=document.getElementById("logBody"); if(!body) return;   // navigated away
  if(res&&res.error){ body.innerHTML='<tr><td colspan="6" class="flag">'+esc(res.error)+'</td></tr>'; return; }
  const rows=res.rows||[]; _logState.total=res.total||0; _logState.offset+=rows.length;
  if(rows.length<150) _logState.done=true;
  if(reset && !rows.length){ body.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">No events'+(_logState.q?' match your search':' yet')+'.</td></tr>'; }
  else body.insertAdjacentHTML("beforeend", rows.map(logRowHTML).join(""));
  const head=document.getElementById("logHead"); if(head) head.textContent=_logState.total+' event(s). A full audit trail — who did what, and when.';
  const f=document.getElementById("logFoot"); if(f) f.textContent=_logState.offset+' of '+_logState.total+' shown';
}
function logOnScroll(e){ const el=e.target; if(el.scrollTop+el.clientHeight >= el.scrollHeight-320) logLoadMore(false); }

/* ---- Batch history: every resolved (completed) batch, newest first ---- */
function renderBatchHistory(c){
  const term=(SEARCH.history||"").toLowerCase();
  let rows=(DB.batches||[]).filter(b=>b.status==="done");
  rows.sort((a,b)=>String(b.completedAt||"").localeCompare(String(a.completedAt||"")));
  const map=b=>{ const lots=(b.lots||[]).map(l=>l.lotId).filter(Boolean).join(", ")||(b.lotIds||[]).join(", ");
    const takas=(b.lots||[]).reduce((n,l)=>n+((l.takaNos||l.takas||[]).length),0);
    return {id:b.id,quality:b.quality||"",shade:b.shadeNo||"",lots,takas,pcs:b.pcs||0,mtr:b.mtr||0,kg:b.weight||0,machine:b.machine||b.mcPin||"",started:b.startedAt||"",resolved:b.completedAt||"",by:b.completedBy||b.startedBy||"",operator:b.operator||"",notes:b.notes||"",
      plcIn:b.actInTime||b.plcIn||"",plcOut:b.actOutTime||b.plcOut||"",water:b.plcWaterTotal||0}; };
  let list=rows.map(map);
  if(term) list=list.filter(r=>[r.id,r.quality,r.shade,r.lots,r.machine,r.by,r.operator,r.notes].some(v=>String(v).toLowerCase().indexOf(term)>=0));

/* ---- Lot history: for one lot — every batch it was punched into (which machine, which workflow
   step, PLC in/out), whether that matches the workflow its quality is assigned, and everything a
   dispatch report has removed from its active stock. See server.py _apply_dispatch / _plc_apply. ---- */
function lotBatchesFor(lotId){
  return (DB.batches||[]).filter(b => (b.lots||[]).some(l=>l.lotId===lotId) || (b.lotIds||[]).includes(lotId))
    .slice().sort((a,b)=>String(a.startedAt||a.completedAt||"").localeCompare(String(b.startedAt||b.completedAt||"")));
}
function lotDispatchesFor(lotId){
  return (DB.lotDispatches||[]).filter(d=>String(d.lotId)===String(lotId))
    .slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
}
/* the workflow builder is a small graph (nodes+edges, wfbuilder.js) — walk it from the "input" node
   forward to get the ordered chain of processType ids a fabric on this flow is expected to visit. */
function wfExpectedChain(workflowId){
  const w=(DB.workflows||[]).find(x=>x.id===workflowId); if(!w) return [];
  const nodes=w.nodes||[], edges=w.edges||[];
  const byId={}; nodes.forEach(n=>byId[n.id]=n);
  const nextOf={}; edges.forEach(e=>{ if(!(e.from in nextOf)) nextOf[e.from]=e.to; });
  let cur=(nodes.find(n=>n.kind==="input")||{}).id, guard=0;
  const chain=[], seen=new Set();
  while(cur && !seen.has(cur) && guard++<200){
    seen.add(cur);
    const n=byId[cur];
    if(n && n.kind==="proc" && n.proc) chain.push(n.proc);
    cur=nextOf[cur];
  }
  return chain;
}
function procName(procId){ const p=(DB.processTypes||[]).find(x=>x.id===procId); return p?(p.name||procId):procId; }
/* actual vs expected: "matches" = every expected step appears, in order, somewhere in what actually
   happened (extra steps like a re-wash in between are fine and not flagged as a mismatch). */
function wfCompareLot(lot, batches){
  const q=(DB.qualities||[]).find(x=>x.name===lot.quality);
  if(!q || !q.workflowId) return null;                        // this quality has no assigned workflow — nothing to check
  const expected=wfExpectedChain(q.workflowId);
  if(!expected.length) return null;
  const actual=batches.map(b=>b.proc).filter(Boolean);
  let i=0, ok=true;
  const stepResults=expected.map(p=>{
    const idx=actual.indexOf(p, i);
    const hit = idx!==-1;
    if(hit) i=idx+1; else ok=false;
    return {proc:p, done:hit};
  });
  const extra=actual.filter(p=>!expected.includes(p));
  return {ok: ok, steps: stepResults, extra};
}

function applyTakaBulk(){
  const ta=document.getElementById("takaBulk"), box=document.getElementById("takaChips"); if(!ta||!box) return;
  let out=[];
  ta.value.split(/[\s,;]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d+)[xX*](\d+(?:\.\d+)?)$/);        // "12x100" = 12 takas of 100 m
    if(m){ const n=Math.min(+m[1],MAX_TAKAS); for(let i=0;i<n;i++) out.push(+m[2]); }
    else { const v=parseFloat(tok); if(!isNaN(v)&&v>0) out.push(v); }

/* SAFE automatic path: merge ONLY width variants, each group into its own short name (server-side,
   per-group) — it can never collapse unrelated qualities into one. */
async function mergeWidthDuplicates(){
  if(!confirm("Merge only width-variant duplicates (e.g. \"AREA 60 INCH\" into \"AREA\")?\n\nEach group merges into its own short name — unrelated qualities are NEVER combined. Lots/shades are re-pointed.")) return;
  const res=await API._post({op:"qualitiesDedupe"});
  if(res&&res.error){ toast(res.error); return; }
  const ov=document.getElementById("mergeOverlay"); if(ov) ov.remove();
  await API.db(); renderNav(); render();
  toast("Merged "+(res.qualitiesRemoved||0)+" width duplicate(s) · re-pointed "+(res.lotsRepointed||0)+" lots");
}
async function doMergeQualities(){
  const names=[...document.querySelectorAll('#mergeList .merge-cb:checked')].map(c=>c.value);
  const into=document.getElementById("mergeInto").value, err=document.getElementById("mergeErr");
  if(names.length<2){ err.style.display="block"; err.textContent="Pick at least two qualities to merge."; return; }
  if(!into){ err.style.display="block"; err.textContent="Choose the name to keep."; return; }
  const others=names.filter(n=>n!==into);
  const affected=(DB.lots||[]).filter(l=>names.indexOf(l.quality)>=0 && l.quality!==into).length;   // lots re-pointed
  const preview='Merge these '+others.length+' quality(ies) INTO "'+into+'":\n\n  • '+others.join("\n  • ")
    +'\n\nThis re-points '+affected+' lot(s) and cannot be undone.';
  const risky = names.length>4 || affected>20;                 // big/mass merge -> require typing to confirm
  if(risky){
    if((prompt(preview+'\n\nThis is a large merge. Type MERGE to confirm:')||"").trim().toUpperCase()!=="MERGE"){ toast("Cancelled"); return; }
  }else if(!confirm(preview)){ return; }
  const res=await API._post({op:"qualitiesMerge", names, into});
  if(res&&res.error){ err.style.display="block"; err.textContent=res.error; return; }
  document.getElementById("mergeOverlay").remove();
  await API.db(); renderNav(); render();
  toast("Merged into "+res.into+" · re-pointed "+res.lotsRepointed+" lots · dropped "+res.shadesRemoved+" shade rows");
}

/* keep the View/Edit permission pair consistent: Edit implies View; removing View removes Edit */
function permSync(el){
  const page=el.dataset.edit||el.dataset.perm;
  const v=document.querySelector('#mBody [data-perm="'+page+'"]');
  const e=document.querySelector('#mBody [data-edit="'+page+'"]');
  if(!v||!e) return;
  if(el.dataset.edit && e.checked) v.checked=true;      // ticking Edit auto-ticks View
  if(el.dataset.perm && !v.checked) e.checked=false;    // unticking View drops Edit
}

function qwfMcMeta(){ return {jet:"water_drop",jigger:"waves",stentor:"compress",heatset:"local_fire_department",drum:"cyclone",hydro:"mode_fan",rope:"timeline"}; }
function wfTopoProcNodes(wf){
  const nodes=wf.nodes||[],edges=wf.edges||[],adj={},indeg={};
  nodes.forEach(n=>{adj[n.id]=[];indeg[n.id]=0;});
  edges.forEach(e=>{ if(adj[e.from]){adj[e.from].push(e.to);indeg[e.to]=(indeg[e.to]||0)+1;} });
  const rank={},q=nodes.filter(n=>indeg[n.id]===0).map(n=>n.id); q.forEach(id=>rank[id]=0);
  const d={...indeg},queue=[...q];
  while(queue.length){ const id=queue.shift(); (adj[id]||[]).forEach(t=>{ rank[t]=Math.max(rank[t]??0,(rank[id]||0)+1); if(--d[t]===0) queue.push(t); }); }
  return nodes.filter(n=>n.kind==="proc").sort((a,b)=>(rank[a.id]||0)-(rank[b.id]||0));
}

/* ---- fields that only apply for certain sibling values, e.g. stentor speed vs. time ---- */
function evalConditionalFields(){
  document.querySelectorAll('#mBody [data-show-k]').forEach(lab=>{
    const src=document.querySelector('#mBody [data-k="'+lab.dataset.showK+'"]');
    const v=src?src.value:"";
    let show=true;
    if(lab.dataset.showEq!=null) show=(v===lab.dataset.showEq);
    if(lab.dataset.showNe!=null) show=show&&(v!==lab.dataset.showNe);
    lab.style.display=show?"":"none";
  });
}

async function saveModal(){
  const sc=SCHEMAS[editTable]; const row=Object.assign({},editRow); let ok=true;
  document.querySelectorAll("#mBody .fld").forEach(l=>l.classList.remove("invalid"));
  sc.fields.forEach(f=>{
    if(f.t==="perms"){
      row.perms=[...document.querySelectorAll('#mBody [data-perm]')].filter(x=>x.checked).map(x=>x.dataset.perm);
      const ed=[...document.querySelectorAll('#mBody [data-edit]')].filter(x=>x.checked).map(x=>x.dataset.edit);
      row.edit=ed.filter(p=>row.perms.indexOf(p)>=0);   // edit is always a subset of view
      return;
    }
    if(f.t==="famsel"){ row.shadeFamilies=[...document.querySelectorAll('#mBody [data-fam]')].filter(x=>x.checked).map(x=>x.dataset.fam); return; }
    if(f.t==="readonly") return;                       // system id — never submitted
    if(f.t==="aux"){ const b=document.getElementById("auxBox");
      row.aux = b?[...b.querySelectorAll(".auxrow")].map(r=>({name:r.querySelector(".a-name").value,
        qty:r.querySelector(".a-qty").value===""?"":+r.querySelector(".a-qty").value,
        unit:r.querySelector(".a-unit").value})).filter(x=>x.name):[]; return; }
    if(f.t==="takas"){ const b=document.getElementById("takaChips");
      row.takas = b?[...b.children].map(c=>+c.dataset.t).filter(n=>!isNaN(n)):[];
      row.pcs = row.takas.length;                       // derived, never typed
      row.meters = Math.round(row.takas.reduce((a,b2)=>a+b2,0));
      return; }
    if(f.t==="lotsel1"){ row[f.k]=lotPickVal(document.querySelector('#mBody [data-k="'+f.k+'"]')); return; }
    if(f.t==="lotqty"){
      row.lots = lotQRows();
      row.lotIds = row.lots.map(r=>r.lotId);
      row.pcs = row.lots.reduce((a,r)=>a+r.pcs,0);
      row.mtr = row.lots.reduce((a,r)=>a+r.mtr,0);
      row.weight = Math.round(row.lots.reduce((a,r)=>a+r.weight,0)*10)/10;
      return;
    }
    if(f.t==="batchTotal") return;   // derived/display-only, nothing to read back
    if(f.t==="workflow"){
      const sel=document.querySelector('#mBody [data-k="workflowId"]'); row.workflowId=sel?sel.value:"";
      const times={}; document.querySelectorAll('#mBody .qwf-time').forEach(inp=>{ if(inp.dataset.node) times[inp.dataset.node]=(inp.value===""?0:+inp.value); });
      row.nodeTimes=times; return;
    }
    const el=document.querySelector('#mBody [data-k="'+f.k+'"]'); if(!el)return;
    let v = f.t==="bool"?el.checked : (f.t==="number"? (el.value===""?"":+el.value) : el.value);
    const lab=el.closest(".fld"); const err=lab.querySelector(".err");
    if(f.t==="password"){
      if(v==="" && !editRow.id){ lab.classList.add("invalid"); if(err)err.textContent="Required for a new user"; ok=false; }
      else if(v!=="" && v.length<6){ lab.classList.add("invalid"); if(err)err.textContent="Min 6 characters"; ok=false; }
      if(v==="") delete row.password; else row.password=v;
      return;
    }
    if(f.req && (v===""||v==null)){ lab.classList.add("invalid"); if(err)err.textContent="Required"; ok=false; }
    else if(f.t==="number" && v!==""){ if(f.min!=null&&v<f.min){lab.classList.add("invalid");if(err)err.textContent="Min "+f.min;ok=false;} if(f.max!=null&&v>f.max){lab.classList.add("invalid");if(err)err.textContent="Max "+f.max;ok=false;} }
    row[f.k]=v;
  });
  if(!ok){ toast("Please fix the highlighted fields"); return; }
  if(editTable==="storageSlots"){
    const clash=(DB.storageSlots||[]).find(s=>s.id!==row.id && s.area===row.area && +s.shelf===+row.shelf && s.col===row.col);
    if(clash){ toast("Shelf "+row.shelf+", column "+row.col+" in "+row.area+" is already occupied — clear it first"); return; }
    if(row.lotId){
      const dup=(DB.storageSlots||[]).find(s=>s.id!==row.id && s.lotId===row.lotId);
      if(dup){ toast("That lot is already stored at "+dup.area+" shelf "+dup.shelf+" column "+dup.col); return; }
    }
  }
  await API.save(editTable,row);
  if(editTable==="qualities") await ensureGreigeShade(row.name);
  closeModal(); renderNav(); render(); toast("Saved");   // DB already patched in place by API.save
}

function handleLotImportFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const wb=XLSX.read(reader.result, {type:"array", cellDates:false});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:""});
      window._importPlan=parseLotWorkbook(rows);
      renderImportReport(window._importPlan);
    }catch(err){
      document.getElementById("importReport").innerHTML='<div class="flag">Could not read this file: '+esc(err.message)+'</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}
/* ---------- lot workbook parser: header-name matched, tolerant of column order ---------- */
function excelSerialToISO(n){
  if(typeof n!=="number") return "";
  const d=new Date(Math.round((n-25569)*86400*1000));
  return d.toISOString().slice(0,10);
}
function parseLotWorkbook(rows){
  if(!rows.length) return {rows:[],newQualities:[],newCustomers:[],newWeavers:[],skipped:0};
  const header=rows[0].map(h=>String(h||"").trim().toUpperCase());
  const col=name=>header.indexOf(name);
  const idx={
    lot:0, inDate:col("INW DATE"), ptyCh:col("PTY CH"), qual:col("QUALITY"), party:col("PARTY GROUP"),
    inwPc:col("INW PC"), inwMt:col("INW MTS."), balPc:col("BAL PC"), balMt:col("BAL MTS."),
    dspPc:col("DSP PCS"), dspMt:col("DSP. MTS."), weaver:col("WEAVER"), master:col("MASTER"),
    oldMt:col("OLD STK MT"), oldPc:col("OLD STK PC"), prodMt:col("PROD MTS"), pend:col("PEND PROD")
  };
  const existQ=new Set((DB.qualities||[]).map(q=>q.name));
  const existC=new Set((DB.customers||[]).map(c=>c.name));
  const existW=new Set((DB.weavers||[]).map(w=>w.name));
  const newQ=new Set(), newC=new Set(), newW=new Set();
  const out=[]; let skipped=0;

  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const lotNo=String(row[idx.lot]||"").trim();
    const qual=String(row[idx.qual]||"").trim();
    const balPc=+row[idx.balPc]||0, balMt=+row[idx.balMt]||0;
    if(!qual || !lotNo || lotNo.toUpperCase()==="GRAND TOTAL" || balPc<=0 || balMt<=0){ skipped++; continue; }

    const party=String(row[idx.party]||"").replace(/,\s*$/,"").trim();
    const weaver=String(row[idx.weaver]||"").trim();
    const master=String(row[idx.master]||"").trim();

    if(!existQ.has(qual)) newQ.add(qual);
    if(party && !existC.has(party)) newC.add(party);
    if(weaver && !existW.has(weaver)) newW.add(weaver);

    out.push({
      srcLotNo:lotNo, quality:qual, customer:party, weaver:weaver, master:master,
      challanNo:String(row[idx.ptyCh]||"").trim(),
      inDate:excelSerialToISO(row[idx.inDate]),
      inwardPcs:+row[idx.inwPc]||0, inwardMeters:+row[idx.inwMt]||0,
      dispatchedPcs:+row[idx.dspPc]||0, dispatchedMeters:+row[idx.dspMt]||0,
      oldStockPcs:+row[idx.oldPc]||0, oldStockMeters:+row[idx.oldMt]||0,
      prodMeters:(row[idx.prodMt]===""?0:+row[idx.prodMt]||0),
      pendingProd:(row[idx.pend]===""?0:+row[idx.pend]||0),
      takas:synthTakas(balMt, balPc),
      status:"in-stock"
    });
  }
  return {rows:out, newQualities:[...newQ], newCustomers:[...newC], newWeavers:[...newW], skipped};
}

    + chip("qualities", plan.newQualities) + chip("customers", plan.newCustomers) + chip("weavers", plan.newWeavers)

async function commitLotImport(){
  const plan=window._importPlan; if(!plan||!plan.rows.length) return;
  const btn=document.getElementById("importCommitBtn"); btn.disabled=true; btn.textContent="Importing…";
  for(const name of plan.newCustomers) await API.save("customers",{name});
  for(const name of plan.newWeavers) await API.save("weavers",{name});
  for(const name of plan.newQualities) await API.save("qualities",{name, gsm:100, width:(cfg().widthDefault||56), maxBatch:300});
  await API.db();
  for(const name of plan.newQualities) await ensureGreigeShade(name);
  await API.db();
  let ok=0;
  for(const r of plan.rows){ const res=await API.save("lots",r); if(!(res&&res.error)) ok++; }
  await API.db();
  document.getElementById("importOverlay").remove();
  renderNav(); render();
  toast("Imported "+ok+" of "+plan.rows.length+" lots");
}

  const quality=g("rcQual"), shade=g("rcShade"), err=document.getElementById("rcErr");
  if(!quality||!shade){ err.style.display="block"; err.textContent="Quality and Shade are required."; return; }
  const items=[...document.querySelectorAll("#rcItems > div")].map(r=>({

function _rval(row,i){ return i<row.length ? row[i] : ""; }
function parseRecipeWorkbook(rows){
  let start=0;
  if(rows.length){ const first=String(_rval(rows[0],0)||"").toUpperCase(), third=String(_rval(rows[0],2)||"").toUpperCase();
    if(first==="MACHINE" || third.indexOf("RECIPE")>=0 || first.indexOf("MACHINE")>=0) start=1; }
  const byName={}; let rowCount=0, skipped=0;
  for(let r=start;r<rows.length;r++){
    const row=rows[r]||[];
    const machine=String(_rval(row,0)||"").trim(), process=String(_rval(row,1)||"").trim(), name=String(_rval(row,2)||"").trim();
    const sub=String(_rval(row,3)||"").trim(), item=String(_rval(row,4)||"").trim(), quality=String(_rval(row,5)||"").trim();
    const seq=+_rval(row,6)||0, qty=+_rval(row,7)||0, unit=String(_rval(row,8)||"").trim().toUpperCase();
    const time=String(_rval(row,9)||"").trim(), shade=String(_rval(row,10)||"").trim();
    let pct=_rval(row,11); pct=(pct===""||pct==null)?(unit==="KG"?Math.round(qty*1e8)/1e6:0):(+pct||0);
    if(!name || !item){ skipped++; continue; }
    rowCount++;
    if(!byName[name]){
      let party=name; const suffix="-"+quality+"-"+shade;
      if(quality && shade && name.toUpperCase().endsWith(suffix.toUpperCase())) party=name.slice(0, name.length-suffix.length);
      else party=name.split("-")[0];
      byName[name]={name, party, quality, shade, machine, process, items:[]};
    }
    byName[name].items.push({subProcess:sub, item, seq, qty, unit, pct, time});
  }
  const recipes=Object.keys(byName).map(k=>{ const rc=byName[k]; rc.items.sort((a,b)=>(+a.seq||0)-(+b.seq||0)); return rc; });
  const existC=new Set((DB.customers||[]).map(c=>String(c.name).toUpperCase()));
  const existQ=new Set((DB.qualities||[]).map(q=>String(q.name).toUpperCase()));
  const newParties=[...new Set(recipes.map(r=>r.party).filter(Boolean))].filter(p=>!existC.has(p.toUpperCase()));
  const newQualities=[...new Set(recipes.map(r=>r.quality).filter(Boolean))].filter(q=>!existQ.has(q.toUpperCase()));
  return {recipes, rowCount, skipped, newParties, newQualities};
}
async function commitRecipeImport(){
  const p=window._recPlan; if(!p||!p.recipes.length) return;
  const btn=document.getElementById("recImpBtn"); btn.disabled=true; btn.textContent="Importing…";

    if(document.getElementById("recReplace").checked) await API._post({op:"recipesClear"});
    if(p.newParties.length) await API._post({op:"bulkUpsert", table:"customers", rows:p.newParties.map(name=>({name}))});
    if(p.newQualities.length) await API._post({op:"bulkUpsert", table:"qualities", rows:p.newQualities.map(name=>({name, gsm:100, width:(cfg().widthDefault||56), maxBatch:300}))});
    for(let i=0;i<p.recipes.length;i+=300){

      if(res&&res.error){ toast(res.error); break; }

const BULK_ADD_TABLES=["machines","customers","suppliers","operators","qcMetrics","shadeRecipes","weavers"];
const BULK_ADD_SKIP_TYPES=new Set(["readonly","perms","aux","takas","lotTotal","lotqty","batchTotal","lotsel","password"]);
const BULK_ADD_KEY_FIELDS={shadeRecipes:["quality","shade"]};   // override when the first column alone isn't a unique key
function bulkAddFields(table){
  return SCHEMAS[table].fields.filter(f=>!BULK_ADD_SKIP_TYPES.has(f.t)).slice(0,7);
}
function bulkAddKeyOf(table, row){
  const keys=BULK_ADD_KEY_FIELDS[table] || [bulkAddFields(table)[0].k];
  return keys.map(k=>String(row[k]==null?"":row[k])).join("\0");
}
function bulkAddOptsFor(f){
  if(f.t==="select") return f.o;
  if(f.t==="qsel") return DB.qualities.map(q=>q.name);
  if(f.t==="csel") return DB.customers.map(x=>x.name);
  if(f.t==="wsel") return (DB.weavers||[]).map(x=>x.name);
  if(f.t==="msel") return (DB.machines||[]).map(x=>x.id);
  if(f.t==="opsel") return (DB.operators||[]).map(o=>o.name);
  if(f.t==="ordsel") return (DB.orders||[]).map(o=>o.id);
  if(f.t==="rolesel") return (DB.roles||[]).map(r=>r.name);
  return null;
}

function parseBulkAdd(table, text){
  const fields=bulkAddFields(table);
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts=line.split(/\t|,/).map(s=>s.trim());
    const row={};
    fields.forEach((f,i)=>{
      let v=parts[i]!==undefined ? parts[i] : "";
      if(f.t==="number") v=v===""?"":+v;
      else if(f.t==="bool") v=/^(y|yes|true|1)$/i.test(v);
      else { const opts=bulkAddOptsFor(f); if(opts && v && opts.indexOf(v)<0) v=""; }
      row[f.k]=v;
    });
    return row;
  }).filter(r=>r[fields[0].k]);
}
async function commitBulkAdd(table){
  const rows=parseBulkAdd(table, document.getElementById("bulkText").value);
  if(!rows.length){ toast("Nothing to add"); return; }
  const btn=document.getElementById("bulkSaveBtn"); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  const byKey={}; (DB[table]||[]).forEach(r=>{ byKey[bulkAddKeyOf(table,r)]=r; });
  for(const r of rows){
    const existing=byKey[bulkAddKeyOf(table,r)];
    const row=existing ? Object.assign({},existing,r) : r;
    await API.save(table, row);
  }
  await API.db(); document.getElementById("bulkOverlay").remove(); renderNav(); render();
  toast("Saved "+rows.length+" record(s)");
}

function lotMetersOf(l){
  const t=(l.takas||[]).map(Number).filter(n=>!isNaN(n));
  return t.length ? t.reduce((a,b)=>a+b,0) : (+l.meters||+l.totalMeters||0);
}
/* GSM from the weighed lots of a quality: kg x 1000 / (meters x width_m) */
function deriveGsmForQuality(name, widthIn){
  const w=(+widthIn||cfg().widthDefault||56)*0.0254;
  let kg=0, m=0, n=0;
  (DB.lots||[]).forEach(l=>{ if(l.quality!==name) return;
    const wt=+l.weight||0, mt=lotMetersOf(l);
    if(wt>0 && mt>0){ kg+=wt; m+=mt; n++; } });
  if(!n || m<=0 || w<=0) return null;
  return { gsm:Math.round(kg*1000/(m*w)), lots:n };
}
function parseQualityQuickAdd(text){
  const dW=cfg().widthDefault||56;
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts=line.split(/\t|,/).map(s=>s.trim());
    const g=parseFloat(parts[1]);
    return { name:parts[0], gsmRaw:(!isNaN(g)&&g>0)?g:null, width:+parts[2]||dW, maxBatch:+parts[3]||300 };
  }).filter(r=>r.name);
}
/* resolve the GSM that will actually be saved, and where it came from */
function qqaResolveGsm(r, existing){
  if(r.gsmRaw>0) return { gsm:r.gsmRaw, src:"typed" };
  const d=deriveGsmForQuality(r.name, r.width);
  if(d) return { gsm:d.gsm, src:"from "+d.lots+" weighed lot"+(d.lots>1?"s":"") };
  if(existing && +existing.gsm>0) return { gsm:+existing.gsm, src:"kept existing" };
  return { gsm:100, src:"default (no weighed lots)" };
}

async function commitQualityQuickAdd(){

     +'<p class="small muted" style="margin:0 0 12px">'+((s.plcEnabled!==false)?'Reading each jet\'s PLC database every 10 seconds.':'Paused — no PLC data is being collected right now.')+'</p>'
     +'<button class="btn '+((s.plcEnabled!==false)?'danger':'')+'" onclick="togglePlc()"><span class="material-symbols-rounded">'+((s.plcEnabled!==false)?'stop_circle':'play_arrow')+'</span>'+((s.plcEnabled!==false)?'Stop PLC import':'Start PLC import')+'</button>'
     +'</div></div>'):'')
   +(canEdit("settings")?('<div class="card" style="margin-top:16px"><div class="card-b">'
     +'<div style="display:flex;align-items:center;gap:8px;margin:0 0 8px"><h2 style="margin:0;font-size:15px">Program scans (camera + QR)</h2><span style="flex:1"></span><button class="btn ghost sm" onclick="loadScans()"><span class="material-symbols-rounded">refresh</span>Refresh</button></div>'
     +'<p class="small muted" id="scanVis" style="margin:0 0 12px">Loading…</p>'
     +'<div id="scanMgr"><p class="small muted">Loading…</p></div>'
     +'</div></div>'):'')
   +'<div class="card" style="margin-top:16px"><div class="card-b">'
     +'<div style="display:flex;align-items:center;gap:8px;margin:0 0 8px">'
       +'<h2 style="margin:0;font-size:15px">Server log</h2>'
       +'<span id="termDot" style="width:8px;height:8px;border-radius:50%;background:var(--success,#2e9e6b);box-shadow:0 0 0 3px rgba(46,158,107,.18)"></span>'
       +'<span class="small muted" id="termInfo">last 40 lines · live</span>'
       +'<span style="flex:1"></span>'
       +'<button class="btn ghost sm" onclick="termlogFetch(true)"><span class="material-symbols-rounded">refresh</span>Refresh</button>'
     +'</div>'
     +'<p class="small muted" style="margin:0 0 10px">What the server is printing right now — startup, lot &amp; challan imports, restarts and errors. Live tail; the full history is under Activity.</p>'
     +'<pre id="termLog" style="margin:0;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;max-height:300px;overflow:auto;color:var(--ink)">Loading…</pre>'
   +'</div></div>';
  termlogStart();
  if(canEdit("settings")) loadScans();
}
async function loadScans(){
  const box=document.getElementById("scanMgr"), vis=document.getElementById("scanVis"); if(!box) return;
  let d; try{ const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"scansList"}),credentials:"same-origin"}); d=await r.json(); }
  catch(e){ box.innerHTML='<p class="small muted">Couldn\'t load scans.</p>'; return; }
  if(d&&d.error){ box.innerHTML='<p class="small muted">'+esc(d.error)+'</p>'; return; }
  const v=d.gemini||{};
  if(vis) vis.innerHTML = v.enabled
    ? 'Reader: <b>Gemini API</b> (<span class="tnum">'+esc(v.model||'')+'</span>). The Batch planner\'s camera button shows a QR code — anyone who scans it can photograph a register from their phone (no login needed there) and it appears back here for the person who opened it to review and punch.'
    : '<span style="color:var(--warning)">The scan reader isn\'t configured yet.</span> Set <span class="tnum">gemini.apiKey</span> in secrets.local.json (see SCAN_SETUP.md).';
  const rows=(d.rows||[]).slice().reverse();
  if(!rows.length){ box.innerHTML='<p class="small muted">No scans stored yet.</p>'; return; }
  box.innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn danger sm" onclick="deleteAllScans('+rows.length+')"><span class="material-symbols-rounded">delete_sweep</span>Delete all ('+rows.length+')</button></div>'
    + rows.map(r=>'<div style="display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px">'
        + (r.files||[]).map(f=>'<a href="/scan-img/'+encodeURIComponent(f)+'" target="_blank"><img src="/scan-img/'+encodeURIComponent(f)+'" style="width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--surface-3)"></a>').join('')
        + '<div style="flex:1;min-width:0"><div class="tnum" style="font-weight:600">'+esc(dmyt(r.at))+'</div>'
        + '<div class="small muted">'+esc((r.machines||[]).join(', '))+' · '+((r.batchIds||[]).length)+' batch(es) · by '+esc(r.by||'')+'</div></div>'
        + '<button class="btn ghost sm" title="delete scan + photos" onclick="deleteScan(\''+esc(r.id)+'\')"><span class="material-symbols-rounded">delete</span></button></div>').join('');
}
async function deleteScan(id){
  if(!window.confirm('Delete this scan and its photos? The batches already created stay in the system.')) return;
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"scanDelete",id:id}),credentials:"same-origin"});
  const j=await r.json().catch(()=>({})); if(j&&j.error){ toast(j.error); return; } loadScans();
}
async function deleteAllScans(n){
  if(!window.confirm('Delete ALL '+n+' stored scans and their photos? The batches already created are kept.')) return;
  let d; try{ const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"scansList"}),credentials:"same-origin"}); d=await r.json(); }catch(e){ return; }
  for(const row of (d.rows||[])){ await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"scanDelete",id:row.id}),credentials:"same-origin"}).catch(()=>{}); }
  loadScans(); toast('Scans deleted');
}
let _termTimer=null;
async function termlogFetch(manual){
  const pre=document.getElementById("termLog"); if(!pre) return;   // left the Settings page
  try{
    const r=await fetch("/api/termlog?n=40",{credentials:"same-origin"});
    if(!r.ok){ pre.textContent=(r.status===403?"You don't have permission to view the server log.":"Log unavailable ("+r.status+")."); return; }
    const d=await r.json();
    const pinned = manual || (pre.scrollTop+pre.clientHeight >= pre.scrollHeight-10);   // keep newest in view unless scrolled up
    pre.textContent=(d.lines||[]).join("\n")||"(no output yet)";
    if(pinned) pre.scrollTop=pre.scrollHeight;
  }catch(e){ pre.textContent="Log unavailable — no connection to the server."; }
}
function termlogStart(){
  if(_termTimer){ clearInterval(_termTimer); _termTimer=null; }
  termlogFetch(true);
  _termTimer=setInterval(()=>{
    if(document.getElementById("termLog")) termlogFetch(false);
    else { clearInterval(_termTimer); _termTimer=null; }        // stop polling once off Settings
  },5000);
}
async function systemUpdate(){
  const out=document.getElementById("sysOut"), btn=document.getElementById("sysUpdBtn");
  out.style.display="block"; out.textContent="Checking GitHub for updates…"; btn.disabled=true;
  const res=await API._post({op:"systemUpdate"});
  btn.disabled=false;
  if(res&&res.error){ out.textContent=res.error; return; }
  out.textContent=(res.output||"")+"\n\n"+(res.changed?"Update applied. The server is restarting — wait a few seconds, then refresh this page.":"Already up to date.");
  if(res.changed) toast("Updated — server restarting, refresh shortly");
}
async function systemRestart(){
  if(!confirm("Restart the server now? Everyone will be briefly disconnected (a few seconds).")) return;
  const out=document.getElementById("sysOut"); if(out){ out.style.display="block"; out.textContent="Restarting the server…"; }
  const res=await API._post({op:"systemRestart"});
  if(res&&res.error){ toast(res.error); return; }
  if(out) out.textContent="Server is restarting. Wait a few seconds, then refresh this page.";
  toast("Server restarting…");
}
async function togglePlc(){
  const s=cfg(), on=s.plcEnabled!==false;
  const next=Object.assign({}, s, {plcEnabled: !on});   // preserve all other settings
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"upsert",table:"__settings__",row:next})});
  const j=await r.json().catch(()=>({})); if(j&&j.error){ toast(j.error); return; }
  await API.db(); render(); toast(on?"PLC import stopped":"PLC import started");
}
async function saveSettings(){
  const st={widthDefault:+s_w.value,minMeters:+s_min.value,stentorSetupMins:+s_sten.value,buffer:+s_buf.value,loadMin:+s_load.value,unloadMin:+s_unload.value,familyPreferencePenaltyMins:+s_fampen.value,capToleranceKg:+document.getElementById("s_captol").value||0,tempToleranceC:+document.getElementById("s_temptol").value||3,completionMode:document.getElementById("s_cmode").value};
  await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"upsert",table:"__settings__",row:st})});
  await API.db(); toast("Settings saved");
}

/* ---- live plan ---- */
function renderPlan(c){
  const S=computeSchedule();
  const maxMin=Math.max(60,...DB.machines.map(m=>S.tl[m.id].cursor))+30;

  // ---- ORDER-WISE plan (which machine each order runs on, over the next hours) ----
  const byOrder={}; S.batches.forEach(b=>{ (byOrder[b.order]=byOrder[b.order]||[]).push(b); });
  let axis='<div class="axis"><div class="glabel"><small>t = now</small></div><div class="ticks" style="width:'+px(maxMin)+'px">';
  for(let h=0;h<=Math.ceil(maxMin/60);h+=2) axis+='<span class="tk" style="left:'+px(h*60)+'px">t+'+h+'h</span>';
  axis+='</div></div>';
  let ordRows='';
  DB.orders.forEach(o=>{
    const bs=(byOrder[o.id]||[]).filter(b=>b.dyeStart!=null).sort((a,b)=>a.dyeStart-b.dyeStart);
    ordRows+='<div class="grow"><div class="glabel"><b>'+esc(o.id)+'</b><small>'+esc(o.cust||"")+'</small></div><div class="gtrack" style="width:'+px(maxMin)+'px">';
    if(bs.length){
      bs.forEach(b=>{ const left=px(b.dyeStart), w=Math.max(38,px(b.dyeEnd-b.dyeStart));
        ordRows+='<div class="blk" style="left:'+left+'px;width:'+w+'px;background:'+shadeColor(b.shade,b.qual)+';color:'+(b.tone>5?'#fff':'#20242c')+'" title="'+esc(o.id)+' · '+esc(b.shade)+' on '+b.mcAssigned+' · t+'+(b.dyeStart/60).toFixed(1)+'h → t+'+(b.dyeEnd/60).toFixed(1)+'h"><b style="font-weight:700">'+b.mcAssigned+'</b><small>'+esc(b.shade)+'</small></div>';
      });
    } else {
      ordRows+='<div style="padding:9px 10px;font-size:11px;color:var(--muted)">not yet scheduled</div>';
    }
    ordRows+='</div></div>';
  });
  const orderCard = DB.orders.length
    ? '<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Order-wise plan</h2><span class="sub">which machine each order runs on over the next hours · t = now</span></div><div style="overflow-x:auto;padding-bottom:6px">'+axis+ordRows+'</div><div class="legend" style="padding:2px 16px 14px">each block = the dye machine an order runs on · coloured by shade · hover for exact t+ window</div></div>'
    : '<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="empty"><span class="material-symbols-rounded">calendar_view_week</span><h3>No orders to plan</h3><p>Add orders on the Operations page and the order-wise plan will appear here.</p></div></div></div>';

  // ---- machine schedule + batch master (unchanged, t+ labels) ----
  const sched=[]; DB.machines.forEach(m=>S.tl[m.id].blocks.forEach(b=>{
    sched.push({mc:m.id,kind:b.kind,ref:b.batch?b.batch.order:"-",shade:b.batch?(b.batch.shade||"-"):"-",qual:b.batch?b.batch.qual:"",start:(b.start/60).toFixed(1),end:((b.start+b.mins)/60).toFixed(1),mins:b.mins});}));
  const machineCard='<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Machine schedule</h2><span class="sub">planned start/end, t+ hours from now</span></div><div class="tbl-wrap"><table><thead><tr><th>M/C</th><th>Step</th><th>Order</th><th>Shade</th><th>Start</th><th>End</th><th>Min</th></tr></thead><tbody>'
    +sched.sort((a,b)=>a.mc.localeCompare(b.mc)||a.start-b.start).map(r=>'<tr><td><b>'+r.mc+'</b></td><td><span class="pill '+(r.kind==="dye"?"run":r.kind)+'">'+r.kind+'</span></td><td>'+esc(r.ref)+'</td><td>'+(r.shade!=="-"?'<span class="swatch" style="background:'+colorFT((SH(r.shade,r.qual)||{}).family,(SH(r.shade,r.qual)||{}).tone)+'"></span>':"")+esc(r.shade)+'</td><td>t+'+r.start+'h</td><td>t+'+r.end+'h</td><td>'+r.mins+'</td></tr>').join("")
    +'</tbody></table></div></div>';
  const batchCard='<div class="card"><div class="card-h"><h2>Batch master (generated)</h2><span class="sub">'+S.batches.length+' batches from '+DB.orders.length+' orders</span></div><div class="tbl-wrap"><table><thead><tr><th>Batch</th><th>Order</th><th>Quality</th><th>Shade</th><th>Family</th><th>Tone</th><th>Meters</th><th>Kg</th><th>M/C</th><th>RFD ready</th></tr></thead><tbody>'
    +S.batches.map(b=>'<tr><td><b>'+b.key+'</b></td><td>'+esc(b.order)+'</td><td>'+esc(b.qual)+'</td><td><span class="swatch" style="background:'+shadeColor(b.shade,b.qual)+'"></span>'+esc(b.shade)+'</td><td>'+b.family+'</td><td>'+b.tone+'</td><td>'+b.meters+'</td><td>'+b.kg+'</td><td>'+(b.mcAssigned||'<span class="flag" title="'+esc(b.unplannedReason||"")+'">unplanned</span>')+(b.pinWarning?' <span class="flag" title="'+esc(b.pinWarning)+'">pin ignored</span>':'')+'</td><td>t+'+((b.rfdReady||0)/60).toFixed(1)+'h</td></tr>').join("")
    +'</tbody></table></div></div>';

  c.innerHTML='<div class="page-head"><h1>Live plan</h1><p>Auto-generated from current orders and masters. Times are relative to now (t).</p></div>'
    + orderCard + machineCard + batchCard;
}

function firstAllowedPage(){ for(const g of NAV) for(const it of g.items) if(can(it[0])) return it[0]; return "dashboard"; }
boot(()=>{
  CUR = can("dashboard") ? "dashboard" : firstAllowedPage();
  const rb=document.getElementById("resetBtn"); if(rb) rb.style.display = can("settings") ? "" : "none";
  renderNav(); render();
  startAutoSync(function(){                        // ~4s live sync — only the live pages, never the data tables/forms
    if(CUR==="dashboard" || CUR==="plan") render();
  });
});
</script>
